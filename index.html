<body>
<div id="splash"><img src="assets/logo.webp" alt="TitTit Games" draggable="false"><div class="by" data-notr>製作人：雀雀遊戲<br>Producer: Tit Tit Games</div></div>
<script>
(function(){   // 開場畫面：圖片載入後顯示 3 秒（點擊可跳過），之後淡出；遊戲在背後照常初始化
  var sp=document.getElementById('splash'),im=sp.querySelector('img'),done=false,started=false;
  var yt=function(f){try{window.ytgame&&window.ytgame.game&&window.ytgame.game[f]()}catch(e){}};
  function hide(){if(done)return;done=true;sp.classList.add('out');setTimeout(function(){sp.remove()},500)}
  function start(){if(started)return;started=true;yt('firstFrameReady');setTimeout(hide,3000)}
  if(im.complete)start();else{im.addEventListener('load',start);im.addEventListener('error',start)}
  setTimeout(start,1500);   // 圖片載入太慢時的保險
  sp.addEventListener('click',hide);
  addEventListener('load',function(){yt('gameReady')});
})();

<script>
const realNow=performance.now.bind(performance);let vClock=realNow(),vLast=vClock,gameSpeed=1;
function gnow(){const r=realNow();vClock+=(r-vLast)*gameSpeed;vLast=r;return vClock}   // 遊戲虛擬時鐘：隨速度倍率流動
const $=id=>document.getElementById(id), dpr=window.devicePixelRatio||1;
function setup(cv,w,h,k){k=k||dpr;cv.width=w*k;cv.height=h*k;cv.style.width=w+'px';cv.style.height=h+'px';const c=cv.getContext('2d');c.setTransform(k,0,0,k,0,0);return c}
const CFG={FIRE_MS:125,SHELL_SPEED:420,
  GENERAL_HP:1,GENERAL_SPEED:80,GENERAL_R:9,GENERAL_HIT_MS:500,   // 士兵每 0.5 秒射一箭
  CASTLE_HP:1000,CASTLE_STEP:1675,   // 主堡基礎血量與每級增量（CASTLE_STEP 稍後會依單位滿級血量重新計算）
  FACTIONS:2,BOSS_FACTIONS:4,BOSS_EVERY:10,   // 一般關 2 方；第 10 的倍數關 4 方（四個角落）
  TURRET_SPIN:1.6,TURRET_IDLE_MUL:3,TURRET_AIM_FILTER:true,TURRET_RANGE:15};   // TURRET_RANGE：砲塔射程 15 格；射向無目標時，砲塔旋轉速度 ×TURRET_IDLE_MUL 且不開火
const isBoss=n=>n%CFG.BOSS_EVERY===0;
Object.assign(CFG,{CATA_RANGE:CFG.TURRET_RANGE+1,CATA_SPEED_MUL:.5,CATA_FIRE_MUL:10,CATA_DMG_MUL:1,CATA_HP_MUL:.5,TURRET_HP:60,CATA_ROCK_SPEED:260,CATA_HIT_BUILDINGS:false});   // 投石車：射程 16 格（砲塔 +1）、移速＝砲塔 1/2、射擊間隔＝砲塔 10 倍、威力＝砲塔 2 倍、血量＝砲塔 1/2；CATA_HIT_BUILDINGS=true 時也會打銀樓與主塔
CFG.DPS_PER_ATK=1000/CFG.FIRE_MS;   // 所有單位 DPS 相同＝每點攻擊力 8 DPS（＝砲塔基礎射速）；射擊頻率越快，每擊傷害越低
CFG.SOLDIER_DMG_MUL=CFG.DPS_PER_ATK*CFG.GENERAL_HIT_MS/1000;   // 士兵每 0.5 秒射一箭 → 每箭傷害 ×4
CFG.CATA_DMG_MUL=CFG.DPS_PER_ATK*CFG.FIRE_MS*CFG.CATA_FIRE_MUL/1000;   // 投石車每 1.25 秒一擊 → 每擊 ×10
CFG.TURRET_SPEED=CFG.GENERAL_SPEED*.5;CFG.CATA_SPEED=CFG.TURRET_SPEED*CFG.CATA_SPEED_MUL;   // 砲塔移動速度＝士兵的 1/2（河流／山地再 ×1/4）
CFG.TRANS_HP_MUL=2;CFG.TRANS_SPEED=CFG.GENERAL_SPEED*3;CFG.TRANS_DODGE=.75;CFG.TRANS_CAP=6;CFG.CATA_MIN_RANGE=10;   // 運輸車：血量＝同等級砲塔 ×2、移速＝士兵 ×3、對所有兵種閃避 75%、載 6 名士兵、無攻擊力；投石車最小射程 10 格（10 格內的敵人打不到）
CFG.UP_RATE=.1;   // 砲塔攻擊頻率每級增加的射速（發/秒）
const winGold=n=>Math.round(20+n*4);   // 過關：第 1 關 24、第 10 關 60、第 30 關 140
const loseGold=n=>Math.max(2,Math.round(n/3+1));   // 失敗：安慰獎
let gold=0,up={rate:0,atk:0,land:0,gen:0,castle:0};
let aiLv={rate:0,atk:0,land:0,gen:0,castle:0};   // AI 本關的等效升級（依關卡）
const aiScale=n=>{   // 第 1 關＝玩家最低屬性（全 0 級）；第 100 關＝玩家最高屬性（各項滿級）；其餘關卡線性變化
  const f=(Math.max(1,Math.min(100,n))-1)/99,L=Math.round(100*f);
  return{rate:L,atk:L,land:L,gen:L,castle:L}};   // 100＝MAXLV（永久升級項目）；局內用軍餉買的彈藥／速度是臨時數值，不在此列
const lvOf=c=>c.human?up:aiLv;
let diff='normal';const aiMul=c=>1;   // 困難模式已取消「AI 屬性 ×1.2」：AI 屬性上限與玩家、一般模式相同function PK(){return diff==='hard'?'_hard':''}
let forceSmart=false,autoCtx=null;const smart=()=>diff==='hard'||forceSmart;   // 困難模式：AI 啟用進階判斷（敵軍動態分析、針對兵種克制、防守支援、集火弱點、攻堅謹慎）   // 困難模式：非玩家陣營所有屬性 ×1.2
try{gold=+localStorage.getItem('sg_gold')||0;Object.assign(up,JSON.parse(localStorage.getItem('sg_up')||'{}'))}catch(e){}
const saveG=()=>{try{localStorage.setItem('sg_gold',gold);localStorage.setItem('sg_up',JSON.stringify(up))}catch(e){}};
const atkOf=c=>(1+lvOf(c).atk)*atkMulOf(c)*aiMul(c);                                        // 砲彈攻擊力（預設 1）
const landHp=id=>{const c=castles&&castles[id-1];return c?(1+lvOf(c).land)*aiMul(c):1};   // 領地基礎血量（預設 1）
const landHpAt=(id,x,y)=>landHp(id)*TERR.NM[terr[y][x]];   // 實際每格血量＝基礎血量 × 地形（高地×3／中地×2／低地×1）
CFG.UNIT_HP_MAX=Math.max(1,Math.round((CFG.GENERAL_HP+100)*10/3))*5;
const genHpLv=L=>Math.round(CFG.TURRET_HP+(CFG.UNIT_HP_MAX-CFG.TURRET_HP)*Math.min(100,L)/100);   // 士兵／砲塔／投石車共用：0 級血量相同（TURRET_HP），線性成長到滿級
CFG.CASTLE_STEP=(CFG.UNIT_HP_MAX*100-CFG.CASTLE_HP)/100;   // 單位（士兵／砲塔／投石車）滿級血量＝士兵滿級血量；主堡滿級血量＝單位滿級血量 ×100，中間各級線性分配
const unitHp=(c,k)=>genHpLv(lvOf(c).gen)*hpMulOf(c)*aiMul(c)*(k==='cata'?CFG.CATA_HP_MUL:k==='trans'?CFG.TRANS_HP_MUL:1);   // 砲塔／投石車血量：隨「士兵強化」等級由基礎值線性成長到士兵滿級血量
const genHp=c=>Math.round(genHpLv(lvOf(c).gen)*hpMulOf(c)*aiMul(c));
const soldierDmg=c=>genAtk(c)*CFG.SOLDIER_DMG_MUL;
const genAtk=c=>atkOf(c)+lvOf(c).atk*aiMul(c);   // 士兵／砲塔／投石車攻擊力：與原本數值相同（原本是 攻擊力等級＋單位強化等級，現在兩者合併成同一個按鈕、同一個等級）                          // 士兵血量（預設 1）
const BASE_NX=76,BASE_NY=52,T=15;let NX=BASE_NX,NY=BASE_NY,WW=NX*T,WH=NY*T,WF=1;   // 世界預設 76×52 格；第 30 關起依關卡放大（WF＝面積倍數）；畫面只顯示其中一塊（鏡頭）

function paperCanvas(w,h,seed,o){   // 宣紙：底色 + 污漬暈染 + 纖維

const SOLDIER_RANGE=2,SR=T*SOLDIER_RANGE;   // 士兵弓箭基礎射程 2 格

const soldierReach=(k,g)=>{const sr=g?soldierSR(g):SR;return(k==='g'||k==='t'||k==='b')?sr:(k==='k'||k==='q')?T*2.5+sr:T*2.6};   // 主堡以外緣起算；k=完好主堡、r=損毀主堡（進駐）
const garCount=t=>generals.reduce((n,g)=>n+(g.home===t?1:0),0)+bunker.reduce((n,g)=>n+(g.home===t?1:0),0);
const garOK=(c,t)=>!!t&&t.c===c&&t.kind==='trans'&&(c.human||smart())&&unlocked('trans')&&turrets.includes(t)&&t.hp>0;   // 困難模式的 AI 也能使用運輸車   // 只有運輸車能載運士兵（砲塔、投石車不行）；只有玩家、且已開放才能載運
const transCount=c=>turrets.filter(t=>t.c===c&&t.kind==='trans').length;
function enemyNear(g,x,y,R){   // R 格內最近的敵對目標（敵方士兵／砲塔／投石車／主堡）
  let best=null,bd=1e9;
  soldierCands(g).forEach(q=>{const d=Math.hypot(q.o.x-x,q.o.y-y)-(isKK(q.kind)?T*2.5:0);if(d<=R&&d<bd){bd=d;best=q}});
  return best}
function engage(g,q){   // 鎖定目標；走得到才算成功
  g.fight=false;
  if(Math.hypot(q.o.x-g.x,q.o.y-g.y)<=soldierReach(q.kind,g)){g.tg=q.o;g.tk=q.kind;g.path=null;g.pi=0;return true}
  const p=soldierPath(Math.floor(g.x/T),Math.floor(g.y/T),Math.floor(q.o.x/T),Math.floor(q.o.y/T));
  if(!p)return false;g.tg=q.o;g.tk=q.kind;g.path=p;g.pi=0;return true}
function walkPath(g,step){while(step>0&&g.pi<g.path.length){const w=g.path[g.pi],wx=w[0]-g.x,wy=w[1]-g.y,wd=Math.hypot(wx,wy);
  if(wd<=step){g.x=w[0];g.y=w[1];step-=wd;g.pi++}else{g.x+=wx/wd*step;g.y+=wy/wd*step;g.ang=Math.atan2(wy,wx);step=0}}}
function rehome(g,now){   // 原本的運輸車被毀：士兵轉為攻擊型，主動打最近的敵人
  g.home=null;g.fight=false;g.tg=null;g.path=null;g.pi=0;g.repAt=0;g.reAt=0;g.pref=prefFor(g.c);g.ptg=ptgFor(g.c)}
function enterBunker(g,now){   // 抵達運輸車 → 上車
  generals=generals.filter(k=>k!==g);g.x=g.home.x;g.y=g.home.y;g.fight=false;g.tg=null;g.path=null;g.scanAt=now+250+Math.random()*250;bunker.push(g)}
function goHome(g,now,s){
  const h=g.home;
  if(Math.hypot(h.x-g.x,h.y-g.y)<=T*1.2){enterBunker(g,now);return}
  if(!g.path||g.pi>=g.path.length||now>=(g.repAt||0)){   // 約每秒重新尋路（砲塔可能在移動）
    g.repAt=now+900+Math.random()*400;
    const p=soldierPath(Math.floor(g.x/T),Math.floor(g.y/T),Math.floor(h.x/T),Math.floor(h.y/T));
    if(p){g.path=p;g.pi=0}else if(!g.path||g.pi>=g.path.length){g.path=[[h.x,h.y]];g.pi=0}}
  walkPath(g,s)}
function hostileNear(g,x,y,R){   // 運輸車的士兵：R 內任何敵對單位或建築（士兵／砲塔／投石車／運輸車／銀樓／主堡）取最近
  let best=enemyNear(g,x,y,R),bd=best?Math.hypot(best.o.x-x,best.o.y-y)-(isKK(best.kind)?T*2.5:0):1e9;
  treasuries.forEach(b=>{if(b.c===g.c||b.c.dead||b.hp<=0)return;const d=Math.hypot(b.x-x,b.y-y);if(d<=R&&d<bd){bd=d;best={o:b,kind:'b'}}});
  return best}
function leaveForRuin(g,r,now){   // 運輸車旁有可佔領的損毀主堡：士兵下車前往佔領（不再回車）
  g.home=null;g.goTo=null;g.ordTg=null;g.keepTg=r;g.pref=null;g.ptg=null;g.tg=null;g.path=null;g.pi=0;g.fight=false;g.goDone=false;g.scanAt=0;floaters.push({x:g.x,y:g.y-T,text:'🚩',born:now})}
function updateBunker(now){   // 車內的士兵：跟著運輸車、停下後每 0.3 秒偵測 7 格內敵人，發現就下車出擊
  bunker.slice().forEach(g=>{
    if(g.c.dead){bunker=bunker.filter(k=>k!==g);return}
    const h=g.home;
    if(!garOK(g.c,h)){bunker=bunker.filter(k=>k!==g);{const sp=soldierFreeSpot(h.x,h.y,g);g.x=sp.x;g.y=sp.y}generals.push(g);g.flash=now+150;rehome(g,now);return}   // 運輸車被毀：士兵現身，轉為攻擊型
    g.x=h.x;g.y=h.y;
    if(h.moving){g.scanAt=now+300;return}   // 運輸車行駛中：士兵留在車內；停下後才會偵測敵人、下車出擊
    if(now<(g.scanAt||0))return;g.scanAt=now+300;
    let q=null;
    if(h.atk&&objAlive(h.atk)&&objOwner(h.atk)!==g.c&&Math.hypot(h.atk.x-h.x,h.atk.y-h.y)<=T*10)q={o:h.atk,kind:objKind(h.atk)};   // 運輸車停下：先下車攻擊玩家指定的對象
    if(!q)q=hostileNear(g,h.x,h.y,T*7);   // 其餘：周圍 7 格有敵對單位或建築就下車
    if(!q){const r=idleRuinNear(g);if(r){bunker=bunker.filter(k=>k!==g);{const sp=soldierFreeSpot(h.x,h.y,g);g.x=sp.x;g.y=sp.y}generals.push(g);g.flash=now+150;leaveForRuin(g,r,now)}return}   // 沒有敵人：附近有損毀主堡就下車去佔領
    const sp0=soldierFreeSpot(h.x,h.y,g),ox=g.x,oy=g.y;g.x=sp0.x;g.y=sp0.y;   // 下車落在附近的空格，不與其他士兵疊在一起
    if(engage(g,q)){bunker=bunker.filter(k=>k!==g);generals.push(g);g.fight=true;g.nextHit=0;g.reAt=now+800;g.flash=now+150;floaters.push({x:g.x,y:g.y-T,text:'⚔',born:now});if(g.c.human)sfx.general()}
    else{g.x=ox;g.y=oy;g.scanAt=now+1500}});
}
const soldierBlockedCell=(x,y)=>soldierCost(x,y)===0||inKeep(x,y)||turrets.some(o=>{const q=tsite(o);return Math.abs(q.gx-x)<=fr(o)&&Math.abs(q.gy-y)<=fr(o)})||treasuries.some(o=>o.gx===x&&o.gy===y);
function soldierFreeSpot(x,y,self){   // 士兵各占 1×1 格：找離 (x,y) 最近、可通行、不在建築上、且沒有其他士兵站著的格子中心（下車用，避免疊在一起）
  const lx=Math.floor(x/T),ly=Math.floor(y/T);
  for(let r=0;r<=8;r++){let best=null,bd=1e9;
    for(let cy=ly-r;cy<=ly+r;cy++)for(let cx=lx-r;cx<=lx+r;cx++){
      if(Math.max(Math.abs(cx-lx),Math.abs(cy-ly))!==r||soldierCost(cx,cy)!==1||soldierBlockedCell(cx,cy))continue;
      const px=(cx+.5)*T,py=(cy+.5)*T;
      if(generals.some(q=>q!==self&&Math.hypot(q.x-px,q.y-py)<T*.9))continue;
      const d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best={x:px,y:py}}}
    if(best)return best}
  return{x,y}}
function separateSoldiers(dt){   // 士兵各占 1×1 格：彼此中心距離至少 T，擠在一起會被慢慢推開（只會推到可通行、沒有建築的格子）
  const n=generals.length;if(n<2)return;
  const B=new Map(),key=(x,y)=>y*8192+x;
  for(const g of generals){const k=key(Math.floor(g.x/T),Math.floor(g.y/T));let a=B.get(k);if(!a)B.set(k,a=[]);a.push(g)}
  const mv=[],maxMove=T*4*dt;
  for(const g of generals){const bx=Math.floor(g.x/T),by=Math.floor(g.y/T);let px=0,py=0,hit=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=B.get(key(bx+dx,by+dy));if(!a)continue;
      for(const q of a){if(q===g)continue;let vx=g.x-q.x,vy=g.y-q.y,d=Math.hypot(vx,vy);if(d>=T*.98)continue;
        if(d<.05){if(g.sepA===undefined)g.sepA=Math.random()*6.283;vx=Math.cos(g.sepA);vy=Math.sin(g.sepA);d=1}
        const ov=(T-d)*.5;px+=vx/d*ov;py+=vy/d*ov;hit=true}}
    if(!hit)continue;const m=Math.hypot(px,py);if(m>maxMove&&m>0){px*=maxMove/m;py*=maxMove/m}
    const nx=g.x+px,ny=g.y+py,cx=Math.floor(nx/T),cy=Math.floor(ny/T);
    if((cx!==bx||cy!==by)&&soldierBlockedCell(cx,cy))continue;
    mv.push(g,nx,ny)}
  for(let i=0;i<mv.length;i+=3){mv[i].x=mv[i+1];mv[i].y=mv[i+2]}}
function soldierStandCell(lx,ly,self){   // 目標土地附近、走得到、且沒有其他「前往待命」士兵佔用的格子（由近到遠）
  for(let r=0;r<=6;r++){let best=null,bd=1e9;
    for(let y=ly-r;y<=ly+r;y++)for(let x=lx-r;x<=lx+r;x++){
      if(Math.max(Math.abs(x-lx),Math.abs(y-ly))!==r||soldierCost(x,y)!==1||inKeep(x,y)||turrets.some(o=>{const q=tsite(o);return Math.abs(q.gx-x)<=fr(o)&&Math.abs(q.gy-y)<=fr(o)})||treasuries.some(o=>o.gx===x&&o.gy===y))continue;   // 不能站在砲塔／投石車／銀樓／主堡上
      if(generals.some(q=>q!==self&&q.goTo&&q.goTo.x===x&&q.goTo.y===y))continue;
      const d=Math.hypot(x-lx,y-ly);if(d<bd){bd=d;best={x,y}}}
    if(best)return best}
  return null}
function idleRuinNear(g){   // GO_CHASE 格內最近的損毀主堡：不論城內有無敵軍；前往＋駐守中的己方士兵還沒超過需求數
  let best=null,bd=1e9;
  keeps.forEach(r=>{if(!r.dead)return;   // 城內有敵軍也照樣前往（在城內交戰，剩下的一方才能佔領）
   
    const d=Math.hypot(r.x-g.x,r.y-g.y)-T*2.5;if(d>GO_CHASE||d>=bd)return;
    if(generals.filter(o=>o.c===g.c&&o.keepTg===r).length+r.gar.filter(o=>o.c===g.c).length>=KEEP_CAPTURE+2)return;
    const p=soldierPath(Math.floor(g.x/T),Math.floor(g.y/T),Math.floor(r.x/T),Math.floor(r.y/T));if(!p)return;
    bd=d;best=r});
  return best}
function updateGenerals(dt,now){
  const reachOf=(k,g)=>soldierReach(k,g);
  generals.slice().forEach(g=>{
    if(g.c.dead||!generals.includes(g))return;
    const gx=Math.floor(g.x/T),gy=Math.floor(g.y/T),slow=(soldierSlow(gx,gy)?.25:1)*((grid[gy]&&grid[gy][gx]&&grid[gy][gx]!==g.c.i+1)?.5:1),s=CFG.GENERAL_SPEED*aiMul(g.c)*dt*slow;
    if(g.home&&!garOK(g.c,g.home))rehome(g,now);
    if(g.goTo&&!g.home){   // 前往指定土地：沿途與到達後，附近 GO_CHASE 格內有敵人就追擊；打完（或追離集結點太遠）就回到集結點待命
      if(g.fight&&(!soldierAlive(g)||(!g.ordTg&&Math.hypot((g.fx||g.x)-g.x,(g.fy||g.y)-g.y)>GO_LEASH))){g.fight=false;g.tg=null;g.path=null;g.pi=0;g.goDone=false;g.scanAt=0}   // 追擊起點超過 GO_LEASH 就放棄，回集結點
      if(!g.fight){
        if(g.ordTg){   // 玩家指定的攻擊對象：優先追打，不受偵測半徑限制
          if(!objAlive(g.ordTg)||objOwner(g.ordTg)===g.c||(objKind(g.ordTg)==='q'&&!hostileGar(g.ordTg,g.c)))g.ordTg=null;
          else if(now>=(g.ordAt||0)){g.ordAt=now+600;if(engage(g,{o:g.ordTg,kind:objKind(g.ordTg)})){g.fight=true;g.nextHit=0;g.reAt=now+800;g.goDone=false;g.fx=g.x;g.fy=g.y;g.leashFree=true}}}
        if(!g.fight&&now>=(g.scanAt||0)){g.scanAt=now+300;const q=enemyNear(g,g.x,g.y,GO_CHASE);if(q){if(engage(g,q)){g.fight=true;g.nextHit=0;g.reAt=now+800;g.goDone=false;g.fx=g.x;g.fy=g.y}else g.scanAt=now+1500}}
        if(!g.fight&&g.goDone&&!g.ordTg&&now>=(g.ruinAt||0)){   // 閒置待命：附近有可佔領的空閒損毀主堡就主動前往駐守
          g.ruinAt=now+1000;const r=idleRuinNear(g);
          if(r){g.keepTg=r;g.goTo=null;g.goDone=false;g.path=null;g.pi=0;g.tg=null;g.pref=null;g.ptg=null;floaters.push({x:g.x,y:g.y-T,text:'🚩',born:now})}}
        if(g.goTo&&!g.fight){
          if(!g.path&&!g.goDone){const p=soldierPath(gx,gy,g.goTo.x,g.goTo.y);if(p){g.path=p;g.pi=0}else g.goTo=null}
          if(g.goTo){if(g.path&&g.pi<g.path.length)walkPath(g,s);else{g.goDone=true;g.path=null}generalStrike(g,now);return}
        }
      }
    }
    if(g.home){   // 搭車型士兵：沿途或附近 7 格內遇到敵人先打；沒敵人就回運輸車
      const h=g.home;
      if(g.fight&&(!soldierAlive(g)||Math.hypot(h.x-g.x,h.y-g.y)>T*12)){g.fight=false;g.tg=null;g.path=null;g.pi=0;g.scanAt=0;g.repAt=0}   // 目標已毀（或追太遠）→ 先看附近還有沒有敵人
      if(!g.fight){
        if(now>=(g.scanAt||0)){g.scanAt=now+300;const q=hostileNear(g,g.x,g.y,T*7);if(q){if(engage(g,q)){g.fight=true;g.nextHit=0;g.reAt=now+800}else g.scanAt=now+1500}
          else{const r=idleRuinNear(g);if(r){leaveForRuin(g,r,now);return}}}
        if(!g.fight){goHome(g,now,s);generalStrike(g,now);return}
      }
    }
    const valid=soldierAlive(g),inReach=valid&&Math.hypot(g.tg.x-g.x,g.tg.y-g.y)<=reachOf(g.tk,g);
    if(g.home||g.goTo){if(!inReach&&now>=(g.reAt||0)){g.reAt=now+800+Math.random()*500;const p=soldierPath(gx,gy,Math.floor(g.tg.x/T),Math.floor(g.tg.y/T));if(p){g.path=p;g.pi=0}}}   // 出擊中：只追原目標，不改挑全場最近
    else if(!valid||(!inReach&&now>=(g.reAt||0))){   // 目標失效就換下一個最近目標；移動中的目標每 ~1 秒重新評估
      if(!valid&&now<(g.retry||0))return;
      const ok=pickSoldierTarget(g,now);g.reAt=now+800+Math.random()*500;
      if(!ok&&!valid){g.tg=null;g.path=null;g.retry=now+1500;return}
    }
    const tg=g.tg,k=g.tk,dx=tg.x-g.x,dy=tg.y-g.y,d=Math.hypot(dx,dy);
    if(d<=reachOf(k,g)){
      g.ang=Math.atan2(dy,dx);
      if(k==='r'){enterKeep(g,tg,now);return}   // 抵達損毀主堡：進駐。其餘目標：由 generalStrike 每 0.5 秒射箭一次（與其他單位相同的相剋優先順序）
    }else{
      g.nextHit=0;
      if(!g.path||g.pi>=g.path.length)g.reAt=0;
      else{
        let step=s;
        while(step>0&&g.pi<g.path.length){
          const w=g.path[g.pi],wx=w[0]-g.x,wy=w[1]-g.y,wd=Math.hypot(wx,wy);
          if(wd<=step){g.x=w[0];g.y=w[1];step-=wd;g.pi++}
          else{g.x+=wx/wd*step;g.y+=wy/wd*step;g.ang=Math.atan2(wy,wx);step=0}
        }
      }
    }
    generalStrike(g,now);
  });
  separateSoldiers(dt);
}

/* ---------- 損毀的主堡：派駐 10 名士兵即可佔領；多方同時駐守則在城內交戰，留下僅存的一方 ---------- */
function soldierSpawnKeep(c,g){   // 士兵／武器一律從「離目標最近的己方主堡」出發
  const own=keepsOf(c);if(!own.length)return null;if(own.length===1)return own[0];
  let best=own[0],bd=1e18;
  const consider=o=>own.forEach(k=>{const d=Math.hypot(o.x-k.x,o.y-k.y);if(d<bd){bd=d;best=k}});
  if(g.keepTg)consider(g.keepTg);else if(g.ptg)consider(g.ptg);else soldierCands(g).forEach(q=>consider(q.o));
  return best}
function placeSoldier(g,k0){const k=k0||soldierSpawnKeep(g.c,g)||g.c;g.x=k.x+(Math.random()-.5)*T;g.y=k.y+(Math.random()-.5)*T;return k}
function assignKeepDuty(g,auto){   // 玩家：依指定的損毀主堡；AI：自動挑最近、尚未派滿的損毀主堡
  const c=g.c;let k=null;
  if(c.human){if(garKeep&&garKeep.dead)k=garKeep}
  else if(auto&&Math.random()<(smart()?1:.7)){let bd=1e18;
    keeps.forEach(r=>{if(!r.dead)return;
      const heading=generals.filter(o=>o.c===c&&o.keepTg===r).length+r.gar.filter(o=>o.c===c).length;
      if(heading>=KEEP_CAPTURE+2)return;
      const d=Math.hypot(r.x-c.x,r.y-c.y);if(d<bd){bd=d;k=r}})}
  if(k){g.keepTg=k;g.pref=null;g.ptg=null}
}
function enterKeep(g,k,now){
  generals=generals.filter(o=>o!==g);
  g.keepTg=null;g.tg=null;g.path=null;g.fight=false;g.x=k.x;g.y=k.y;
  if(!k.dead){generals.push(g);return}
  k.gar.push(g);
  floaters.push({x:k.x,y:k.y-T*3,text:'🚩'+g.c.d.n+'軍駐守 '+k.gar.filter(o=>o.c===g.c).length+'/'+KEEP_CAPTURE,born:now});
  if(g.c.human)sfx.general();
}
function captureKeep(k,c,now){
  const all=k.gar;k.gar=[];const used=all.slice(0,KEEP_CAPTURE),sold=all.slice(KEEP_CAPTURE);   // 派駐的 10 名士兵融入主堡而消失（士兵數量扣除 10 名份額）；超出的才留下
  used.forEach(g=>splash(k.x+(Math.random()-.5)*T*2,k.y+(Math.random()-.5)*T*2,6,c.d.g,60));
  k.dead=false;k.auto=null;k.owner=c;k.i=c.i;k.d=c.d;k.human=c.human;k.hp=k.maxHp=keepMaxHp(c);k.flash=now+500;k.nextArrow=now+600;   // 旗幟（k.d）換成新勢力
  const R=CFG.START_RANGE,b=castleBounds(k);   // 與開局相同：主堡佔地＋向外 5 格成為新主人的勢力範圍
  for(let y=b.y0-R;y<=b.y1+R;y++)for(let x=b.x0-R;x<=b.x1+R;x++){
    if(!isLand(x,y)||isRiver(x,y)||isMount(x,y))continue;
    const inside=x>=b.x0&&x<=b.x1&&y>=b.y0&&y<=b.y1;

/* ---------- 主堡弓箭：只射 10 格內的敵方士兵與敵方砲塔，一次鎖定 1 個目標 ---------- */
const ARROW_RANGE=T*10;
function arrowTarget(k){
  const c=k.owner;let best=null,bd=ARROW_RANGE;
  generals.forEach(g=>{if(g.c===c||g.hp<=0)return;const d=Math.hypot(g.x-k.x,g.y-k.y);if(d<=bd){bd=d;best=g}});
  turrets.forEach(t=>{if(t.c===c)return;const d=Math.hypot(t.x-k.x,t.y-k.y);if(d<=bd){bd=d;best=t}});
  return best;
}
function castleArrow(k,now){   // 每座完好的主堡各自射箭
  const c=k.owner;if(!c||now<k.nextArrow)return;
  const tg=arrowTarget(k);if(!tg)return;
  const a=Math.atan2(tg.y-k.y,tg.x-k.x);
  arrows.push({c,id:c.i+1,x:k.x+Math.cos(a)*T*.8,y:k.y+Math.sin(a)*T*.8,a,tg,
    spd:CFG.SHELL_SPEED*Math.min(3,1+speedLvOf(c)*.5)*aiMul(c)*.5,
    dmg:atkOf(c)*.5});
  k.nextArrow=now+rate(c)*2;
  sfx.shoot(c.human);
}
function updateArrows(dt,now){
  for(let i=arrows.length-1;i>=0;i--){
    const p=arrows[i],tg=p.tg;
    const alive=p.c.dead?false:p.ty?objAlive(tg):tg.gx!==undefined?turrets.includes(tg):generals.includes(tg);
    if(!alive){arrows.splice(i,1);continue}
    const dx=tg.x-p.x,dy=tg.y-p.y,d=Math.hypot(dx,dy),step=p.spd*dt;p.a=Math.atan2(dy,dx);
    if(d<=step+6){
      arrows.splice(i,1);
      if(p.ty){soldierArrowLand(p,now);continue}   // 士兵射出的箭
      if(tg.gx!==undefined){   // 敵方砲塔
        const dm=duelDmg('turret',tg,p.dmg,now);tg.hp-=dm;tg.flash=now+120;if(dm>0)sfx.hit();
        if(tg.hp<=0){tDown(tg,p.id);turrets=turrets.filter(k=>k!==tg);splash(tg.x,tg.y,10,'#1a120c',80);floaters.push({x:tg.x,y:tg.y,text:'💥'+uName(tg)+'被弓箭擊毀',born:now});sfx.turretKill()}
      }else hitGeneral(tg,now,p.dmg,p.id,'turret');   // 城堡弓箭＝砲塔類
    }else{p.x+=dx/d*step;p.y+=dy/d*step}
  }
}

/* ---------- 砲塔與射擊 ---------- */

/* ---------- 射線判斷：砲彈沿這個角度飛出去，會不會打到能佔領的格子或敵方物件？（格子步進 DDA，與砲彈實際判定一致）---------- */
function rayTarget(c,x0,y0,a,maxD=Infinity){
  maxD-=T*.6+4;   // 射線從砲口前 0.6 格起算，砲彈的射程也是從砲塔中心算：扣掉這段，射線判定與砲彈實際能飛到的距離完全一致（距離外的目標、土地一律不開火）
  const id=c.i+1,dx=Math.cos(a),dy=Math.sin(a),px=x0+dx*T*.6,py=y0+dy*T*.6;
  let cx=Math.floor(px/T),cy=Math.floor(py/T);
  const sx=dx>0?1:-1,sy=dy>0?1:-1,adx=Math.abs(dx),ady=Math.abs(dy),tdx=adx>1e-9?T/adx:1e9,tdy=ady>1e-9?T/ady:1e9;
  let tx=adx>1e-9?((dx>0?(cx+1)*T-px:px-cx*T)/adx):1e9,ty=ady>1e-9?((dy>0?(cy+1)*T-py:py-cy*T)/ady):1e9,dist=0,hit=false;
  for(let i=0;i<800;i++){
    if(dist>maxD){break}   // 超出射程
    if(!isLand(cx,cy)){if(!(SHAPE.flyover&&voidAt(cx,cy)===1)){break}}   // 外圍高山／海面：砲彈消失
    else if(isMount(cx,cy)){break}                                      // 山地擋砲彈
    else if(isCastle(cx,cy)){if(castleAt(cx,cy).i+1!==id){hit=true;break}}else if(inKeep(cx,cy)){}   // 敵方主堡；損毀的主堡＝廢墟，直接飛越
    else if(!isRiver(cx,cy)&&grid[cy][cx]!==id){hit=true;break}        // 非己方陸地＝可佔領／攻擊（河湖飛越）
    if(tx<ty){dist=tx;tx+=tdx;cx+=sx}else{dist=ty;ty+=tdy;cy+=sy}
  }
  if(hit)return true;
  const R=CFG.GENERAL_R+2;   // 路徑上（到終點為止）有敵方士兵也算有目標
  const lim=Math.min(dist,maxD);
  for(const g of generals.concat(turrets.filter(q=>q.moving))){   // 移動中的敵方砲塔也是目標
    if(g.c===c||g.hp<=0)continue;const rx=g.x-px,ry=g.y-py,t=rx*dx+ry*dy;
    {const RR=g.gx!==undefined?T*1.3:R;if(t>=-RR&&t<=lim+RR&&Math.abs(rx*dy-ry*dx)<=RR)return true}}
  return false;
}
function volley(c,x,y,a,am=1,rng=0){
  mkShell(c,x,y,a,am,rng);
  sfx.shoot(c.human);
}
const rate=c=>1000/((1000/CFG.FIRE_MS+lvOf(c).rate*CFG.UP_RATE)*aiMul(c));   // 發/秒 → 間隔(ms)；玩家加上升級加成
const mkShell=(c,x,y,a,am=1,rng=0)=>shells.push({rng,trav:T*.6,x:x+Math.cos(a)*T*.6,y:y+Math.sin(a)*T*.6,a,owner:c.d.n,id:c.i+1,col:c.d.g,spd:CFG.SHELL_SPEED*Math.min(3,1+speedLvOf(c)*.5)*aiMul(c),dmg:genAtk(c)*am});
const RANGE_ADD=[0,1,2];   // 射程加成（格）：低地 +0／中地 +1／高地 +2（依砲塔／投石車所在格的地形）
const rangeBonusAt=(x,y)=>RANGE_ADD[(terr[Math.max(0,Math.min(NY-1,y))]||[])[Math.max(0,Math.min(NX-1,x))]]||0;
const turretRange=t=>CFG.TURRET_RANGE+rangeBonusAt(t.gx,t.gy),cataRange=t=>CFG.CATA_RANGE+rangeBonusAt(t.gx,t.gy);   // 單位：格
const turretAt=(x,y)=>turrets.find(t=>t.gx===x&&t.gy===y)||turrets.find(t=>Math.abs(t.gx-x)<=1&&Math.abs(t.gy-y)<=1);
const bankAt=(x,y)=>treasuries.find(t=>Math.abs(t.gx-x)<=1&&Math.abs(t.gy-y)<=1);
const fr=o=>o.kind==='trans'?-1:o.kind==='cata'?0:1;   // 運輸車不佔地（-1＝不擋任何建築）   // 佔地半徑：砲塔 3×3（1）、投石車 1×1（0，畫面大小不變）
const cover=(x,y)=>turretAt(x,y)||bankAt(x,y)||turrets.find(o=>o.dest&&Math.abs(o.dest.gx-x)<=1&&Math.abs(o.dest.gy-y)<=1);
const tsite=o=>o.dest||o;   // 移動中的砲塔以「目的地」佔位
const soldierHold=(x,y,r)=>generals.some(g=>g.goTo&&g.hp>0&&Math.abs(g.goTo.x-x)<=r&&Math.abs(g.goTo.y-y)<=r);   // 士兵集結（待命）的 1×1 格子也算有物體：砲塔／投石車／銀樓不能蓋在上面
function bankOK(x,y,id){   // 銀樓上限 15 座：只需己方陸地、非主堡、該格沒有砲塔／銀樓即可（可緊鄰擺放）
  if(!isLand(x,y)||isRiver(x,y)||inKeep(x,y)||grid[y][x]!==id)return false;
  return !soldierHold(x,y,0)&&!turrets.some(o=>{const q=tsite(o);return Math.abs(q.gx-x)<=fr(o)&&Math.abs(q.gy-y)<=fr(o)})&&!treasuries.some(o=>o.gx===x&&o.gy===y)}
function fpOK(x,y,id,ign,kind){
  if(kind==='trans'||(ign&&ign.kind==='trans')){   // 運輸車：可開到任何一般陸地（含敵方領地），不能停在主堡／砲塔／投石車／銀樓上，也不與其他運輸車重疊
    if(!isLand(x,y)||soldierCost(x,y)!==1||inKeep(x,y))return false;
    return !turrets.some(o=>{if(o===ign)return false;const q=tsite(o);return o.kind==='trans'?(q.gx===x&&q.gy===y):(Math.abs(q.gx-x)<=fr(o)&&Math.abs(q.gy-y)<=fr(o))})&&!treasuries.some(o=>o.gx===x&&o.gy===y)}   // 砲塔 3×3 佔地：九格都必須是己方陸地、不是主堡，且不與其他砲塔／銀樓重疊；投石車只佔 1×1（和銀樓一樣）
  if(kind==='cata'||(ign&&ign.kind==='cata')){
    if(!isLand(x,y)||isRiver(x,y)||inKeep(x,y)||grid[y][x]!==id)return false;
    return !soldierHold(x,y,0)&&!turrets.some(o=>{if(o===ign)return false;const q=tsite(o);return Math.abs(q.gx-x)<=fr(o)&&Math.abs(q.gy-y)<=fr(o)})&&!treasuries.some(o=>o.gx===x&&o.gy===y)}
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(!isLand(xx,yy)||isRiver(xx,yy)||inKeep(xx,yy)||grid[yy][xx]!==id)return false}

/* ---------- 地形：低(0) / 中(1) / 高(2) ----------
   中立血量 ×1 / ×2 / ×3（影響第一次佔領）；佔領後該格上的砲塔 攻擊與血量 ×1 / ×1.5 / ×2。主塔固定在低地。 */
const TERR={NM:[1,2,3],HM:[1,1.1,1.2],AM:[1,1.1,1.2],names:['低','中','高']};
let terr=[],terrBase=null,terrFx=null,riverCv=null,river=null,mount=null,mountPeaks=[],riverMode=true;

const isRiver=(x,y)=>!!(river&&river[y]&&river[y][x]);   // 水域＝河川＋湖泊（第 11 關起才會出現）

function drawPeak(c,pk){const{bx,by,h,hw}=pk;
  c.fillStyle='#4a3f34';c.beginPath();c.moveTo(bx-hw,by);c.lineTo(bx,by-h);c.lineTo(bx+hw,by);c.closePath();c.fill();
  c.fillStyle='#7a6b58';c.beginPath();c.moveTo(bx,by-h);c.lineTo(bx+hw,by);c.lineTo(bx+hw*.15,by);c.closePath();c.fill();
  c.fillStyle='#f3efe6';c.beginPath();c.moveTo(bx,by-h);c.lineTo(bx-hw*.32,by-h*.68);c.lineTo(bx-hw*.08,by-h*.74);c.lineTo(bx+hw*.1,by-h*.64);c.lineTo(bx+hw*.3,by-h*.68);c.closePath();c.fill();
  c.strokeStyle='#2a221a';c.lineWidth=.8;c.beginPath();c.moveTo(bx-hw,by);c.lineTo(bx,by-h);c.lineTo(bx+hw,by);c.stroke()}
function genRivers(){
  river=Array.from({length:NY},()=>Array(NX).fill(false));
  if(!riverMode||stage<=10)return;   // 河川與湖泊：第 10 關之後才會隨機出現
  const r=rng((Math.random()*1e9)>>>0),want=Math.round((r()<.5?1:2)*WF);let made=0;
  for(let tries=0;tries<60*WF&&made<want;tries++){
    const horiz=r()<.5,L=horiz?NX:NY,W=horiz?NY:NX,base=W*(.3+.4*r()),p1=r()*6.28,p2=r()*6.28,f1=.12+r()*.08,f2=.31+r()*.1,a1=2.5+r()*3,a2=1+r()*1.5,rad=1.1+r()*.5;
    const cells=[];
    for(let t=0;t<=L;t+=.4){
      const v=base+a1*Math.sin(t*f1+p1)+a2*Math.sin(t*f2+p2),cx=horiz?t:v,cy=horiz?v:t;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=Math.round(cx)+dx,y=Math.round(cy)+dy;if(Math.hypot(x-cx,y-cy)<=rad&&isLand(x,y))cells.push([x,y])}
    }
    if(cells.length<20)continue;
    if(cells.some(([x,y])=>castles.some(k=>Math.hypot(x-k.gx,y-k.gy)<7)))continue;   // 河川不穿過主塔附近
    cells.forEach(([x,y])=>{river[y][x]=true});made++;

    const cx=6+r()*(NX-12),cy=6+r()*(NY-12),rx=3+r()*3,ry=2.5+r()*2.5,ph=r()*6.28,cells=[];
    for(let y=Math.floor(cy-ry-2);y<=Math.ceil(cy+ry+2);y++)for(let x=Math.floor(cx-rx-2);x<=Math.ceil(cx+rx+2);x++){
      const d=Math.hypot((x-cx)/rx,(y-cy)/ry);if(d<1+.2*Math.sin(Math.atan2(y-cy,x-cx)*3+ph)&&isLand(x,y))cells.push([x,y])}
    if(cells.length<16)continue;
    if(cells.some(([x,y])=>castles.some(k=>Math.hypot(x-k.gx,y-k.gy)<7)))continue;
    cells.forEach(([x,y])=>{river[y][x]=true});lakes++;

function genMountains(){   // 高山：條狀山脈，避開主塔與水域
  mount=Array.from({length:NY},()=>Array(NX).fill(false));

  for(let k=0;k<n;k++)for(let tries=0;tries<40;tries++){
    const cx=3+r()*(NX-6),cy=3+r()*(NY-6),len=3+r()*5,ang=r()*3.14,w=1.3+r()*.9,cells=[];
    for(let t=-len;t<=len;t+=.5){

      for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=Math.round(px)+dx,y=Math.round(py)+dy;if(Math.hypot(x-px,y-py)<=ww&&isLand(x,y)&&!isRiver(x,y))cells.push([x,y])}

/* ---------- 地圖外圍：極高山脈（任何人物與砲彈都無法進入）----------
   voidK：0＝陸地、1＝被陸地夾住的內海（凹形地圖，砲彈可飛越）、2＝外圍（深海或高山，完全無法觸及）。
   外圍一律是高山（不再有深海）。 */
let voidK=null,voidD=null,voidCv=null,voidPeaks=[];
const voidAt=(x,y)=>(x<0||y<0||x>=NX||y>=NY||!voidK)?2:voidK[y][x];
function buildVoid(){
  // 外圍一律是無法觸及的高山
  const mk=v=>Array.from({length:NY},()=>Array(NX).fill(v));
  const hl=mk(false),hr=mk(false),vu=mk(false),vd=mk(false);
  for(let y=0;y<NY;y++){let s=false;for(let x=0;x<NX;x++){if(mask[y][x])s=true;hl[y][x]=s}s=false;for(let x=NX-1;x>=0;x--){if(mask[y][x])s=true;hr[y][x]=s}}
  for(let x=0;x<NX;x++){let s=false;for(let y=0;y<NY;y++){if(mask[y][x])s=true;vu[y][x]=s}s=false;for(let y=NY-1;y>=0;y--){if(mask[y][x])s=true;vd[y][x]=s}}
  voidK=mk(0);voidD=mk(-1);const q=[];
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){
    if(mask[y][x]){voidD[y][x]=0;q.push([x,y]);continue}
    voidK[y][x]=2}
  for(let i=0;i<q.length;i++){const[x,y]=q[i];[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const xx=x+a,yy=y+b;if(xx>=0&&yy>=0&&xx<NX&&yy<NY&&voidD[yy][xx]<0){voidD[yy][xx]=voidD[y][x]+1;q.push([xx,yy])}})}
  const r=rng((Math.random()*1e9)>>>0),lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  voidCv=document.createElement('canvas');const c=setup(voidCv,WW,WH,LS);
  c.fillStyle='#2e261f';c.fillRect(0,0,WW,WH);
  const tiny=document.createElement('canvas');tiny.width=NX;tiny.height=NY;const tc=tiny.getContext('2d');
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){if(mask[y][x])continue;
    if(voidK[y][x]===1)tc.fillStyle='rgb(63,127,176)';
    else{const t=Math.min(1,voidD[y][x]/8);tc.fillStyle=`rgb(${lerp(118,50,t)},${lerp(104,42,t)},${lerp(86,36,t)})`}
    tc.fillRect(x,y,1,1)}
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';if('filter' in c)c.filter='blur(3px)';c.drawImage(tiny,0,0,WW,WH);if('filter' in c)c.filter='none';
  c.lineCap='round';voidPeaks=[];
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){if(mask[y][x])continue;
    const water=voidK[y][x]===1;
    if(water){   // 浪紋
      for(let k=0;k<2;k++)if(r()<.7){const x0=x*T+r()*T*.7,y0=y*T+3+r()*(T-6);c.strokeStyle=voidK[y][x]===1?'rgba(235,246,252,.55)':'rgba(190,220,240,.3)';c.lineWidth=1;c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(x0+4,y0-3,x0+8,y0);c.quadraticCurveTo(x0+12,y0+3,x0+16,y0);c.stroke()}
    }else{   // 岩壁皴法
      for(let k=0;k<3;k++){const sx=x*T+r()*T,sy=y*T+r()*T*.7,len=4+r()*5;c.strokeStyle='rgba(18,12,8,.35)';c.lineWidth=1;c.beginPath();c.moveTo(sx,sy);c.lineTo(sx+len*.4,sy+len);c.stroke()}
      const d=voidD[y][x];
      if(d>=1&&r()<.85){   // 越深入外圍山越高；高度受限以免遮住陸地
        const h=T*Math.min(d-.15,4.2)*(.8+.2*r()),hw=T*(.42+.09*Math.min(d,6)+r()*.2);
        voidPeaks.push({bx:x*T+T/2+(r()-.5)*T*.8,by:y*T+T*.9,h,hw})}
    }
  }

/* ---------- 四季與天空（純裝飾，不影響遊戲）----------

   地面色調、積雪、草、花、樹葉都隨月份漸進變化；天空有半透明雲朵（時多時少）與偶爾直線飛過的小鳥。 */
const SEA_ICON=['❄️','🌱','☀️','🍂'],seaIdx=m=>m===12||m<=2?0:m<=5?1:m<=8?2:3;

const SEA_KF={   // 1~12 月「月中」的關鍵值，月與月之間平滑漸變
  snow:[1,.9,.35,0,0,0,0,0,0,0,.12,.7],
  dens:[.35,.35,.65,.9,1,1,1,1,.9,.75,.55,.4],
  flower:[0,0,.25,.75,1,.55,.25,.1,0,0,0,0],
  leaf:[0,0,.25,.7,1,1,1,1,.95,.75,.25,0],
  blossom:[0,0,.5,1,.2,0,0,0,0,0,0,0],
  grass:[[168,160,128],[165,160,126],[128,170,92],[96,168,78],[74,160,66],[58,146,60],[52,138,58],[74,138,54],[140,150,56],[196,160,52],[172,128,60],[166,150,118]],
  leafC:[[150,110,60],[150,110,60],[150,190,90],[120,184,84],[84,160,70],[60,138,60],[50,128,56],[60,128,52],[150,150,50],[214,140,40],[176,98,40],[150,110,60]],
  tint:[[225,232,240,.16],[225,232,240,.14],[150,185,110,.16],[110,180,85,.22],[88,170,78,.24],[70,158,70,.24],[64,150,66,.24],[96,150,62,.22],[170,165,60,.22],[215,170,55,.26],[190,140,70,.22],[190,185,170,.14]]};
const SEA={t:null,deco:null,rowIdx:null,noise:null,S:{snow:0,dens:0,flower:0,leaf:0,blossom:0,grass:[0,0,0],leafC:[0,0,0],tint:[0,0,0,0],mo:1}};
function seaState(now){
  const S=SEA.S,el=Math.max(0,gameOver?battleEnd:now-battleT0),P=el/60000,f=(((P%12)+12)%12)-.5,i0=Math.floor(f),u=f-i0,t=u*u*(3-2*u),a=((i0%12)+12)%12,b=(a+1)%12;
  for(const k of['snow','dens','flower','leaf','blossom']){const v=SEA_KF[k];S[k]=v[a]+(v[b]-v[a])*t}
  for(const k of['grass','leafC','tint']){const v=SEA_KF[k],o=S[k];for(let j=0;j<o.length;j++)o[j]=v[a][j]+(v[b][j]-v[a][j])*t}
  S.mo=Math.floor(P%12)+1;return S}
const rgbS=(c,k=1,m=0)=>`rgb(${Math.min(255,c[0]*k+m)|0},${Math.min(255,c[1]*k+m)|0},${Math.min(255,c[2]*k+m)|0})`;
function buildSeasonDeco(){   // 每張地圖建一次：草叢、花、樹的位置與隨機門檻（門檻越低越早出現、越晚消失）
  const r=rng((Math.random()*1e9)>>>0),items=[],nz=new Float32Array(NX*NY),sm=new Float32Array(NX*NY);
  for(let i=0;i<nz.length;i++)nz[i]=r();
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){let s=0,n=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<NX&&yy<NY){s+=nz[yy*NX+xx];n++}}sm[y*NX+x]=Math.max(0,Math.min(1,.5+(s/n-.5)*3.2))*.78+nz[y*NX+x]*.22}
  SEA.noise=sm;
  const near=(px,py)=>castles.some(k=>Math.abs(k.x-px)<T*3.6&&Math.abs(k.y-py)<T*3.6);
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){
    if(!mask[y][x]||isRiver(x,y)||isMount(x,y))continue;const lv=terr[y][x];
    for(let k=0;k<2;k++){const px=(x+r())*T,py=(y+r())*T;if(!near(px,py))items.push({t:0,x:px,y:py,u:r(),s:.7+r()*.6,j:r()*3|0})}
    if(lv<2&&r()<.7){const px=(x+r())*T,py=(y+r())*T;if(!near(px,py))items.push({t:1,x:px,y:py,u:r(),h:r()*4|0})}
    if(r()<(lv===2?.1:.07)){const px=(x+.15+r()*.7)*T,py=(y+.5+r()*.5)*T;if(!near(px,py))items.push({t:2,x:px,y:py,u:r(),k:r()<.28?1:0,s:.8+r()*.45,bl:r()<.35?1:0,lj:r()})}
  }
  items.sort((p,q)=>p.y-q.y);
  const ri=new Int32Array(NY+2);let p=0;for(let y=0;y<=NY+1;y++){while(p<items.length&&items[p].y<y*T)p++;ri[y]=p}
  SEA.deco=items;SEA.rowIdx=ri;SEA.tb=terrBase}
function seasonGround(c,S,gx0,gx1,gy0,gy1){   // 色調＋積雪：畫在領地色之上、邊界線之下
  if(SEA.tb!==terrBase||!SEA.deco)buildSeasonDeco();
  c.save();c.globalAlpha=S.tint[3];c.fillStyle=rgbS(S.tint);c.beginPath();
  for(let y=gy0;y<=gy1;y++)for(let x=gx0;x<=gx1;x++)if(mask[y][x]&&!isRiver(x,y)&&!isMount(x,y))c.rect(x*T,y*T,T,T);
  c.fill();

    for(let y=gy0;y<=gy1;y++)for(let x=gx0;x<=gx1;x++){if(!mask[y][x]||isRiver(x,y)||isMount(x,y))continue;
      const cv=Math.max(0,Math.min(1,(S.snow*1.2-nz[y*NX+x])/.28));if(cv>.02)B[Math.min(2,(cv*3)|0)].push(x,y)}

function seasonDeco(c,S,gx0,gx1,gy0,gy1){   // 草、花、樹（只畫鏡頭內的）

      c.moveTo(o.x,o.y);c.lineTo(o.x-1.5*s,o.y-4.2*s);c.moveTo(o.x,o.y);c.lineTo(o.x+.2*s,o.y-5.6*s);c.moveTo(o.x,o.y);c.lineTo(o.x+1.7*s,o.y-3.8*s)}

function smoothPath(p){   // Catmull-Rom → 貝茲曲線
  if(p.length<2)return'';let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

(function bindSunSecret(){
  const sc=$('mapscroll'),bg=$('mapbg'),GOAL=30;
  let cnt=0,lastT=0,armed=false,down=null;
  const sunEl=()=>bg.querySelector('.sun');
  sc.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,s:sc.scrollLeft}},true);
  sc.addEventListener('click',e=>{
    if(armed||!down)return;
    const d=down;down=null;
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>8||Math.abs(sc.scrollLeft-d.s)>2)return;   // 拖曳／捲動不算點擊
    const s=sunEl();if(!s)return;
    const r=s.getBoundingClientRect();
    if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))>r.width/2)return;
    const t=Date.now();cnt=(t-lastT>2500)?1:cnt+1;lastT=t;   // 兩次點擊間隔超過 2.5 秒就重算
    if(cnt>=5){cnt=0;armed=true;bindSun(s);s.classList.add('armed')}
  });
  function bindSun(s){
    if(s._sb)return;s._sb=1;
    let g=null,raf=0;
    const kOf=()=>bg.getBoundingClientRect().width/(bg.offsetWidth||1);   // 畫面縮放比例
    s.addEventListener('wheel',e=>{sc.scrollLeft+=e.deltaY*(e.deltaMode===1?30:1);e.preventDefault()},{passive:false});
    s.addEventListener('pointerdown',e=>{
      if(!armed||g)return;
      g={k:kOf(),x:e.clientX,y:e.clientY,l:s.offsetLeft,t:s.offsetTop};
      s.style.right='auto';s.style.left=g.l+'px';s.style.top=g.t+'px';
      s.classList.add('dragging');s.setPointerCapture(e.pointerId);e.preventDefault();
      (function edge(){   // 拖到畫面左右邊緣時自動捲動地圖，才拉得到遠處的關卡
        if(!g)return;
        const b=bg.getBoundingClientRect(),r=s.getBoundingClientRect(),cx=r.left+r.width/2,m=70*g.k;
        if(cx<b.left+m)sc.scrollLeft-=16;else if(cx>b.right-m)sc.scrollLeft+=16;
        raf=requestAnimationFrame(edge)})();
    });
    s.addEventListener('pointermove',e=>{
      if(!g)return;
      const W=bg.offsetWidth,H=bg.offsetHeight,h=s.offsetWidth/2;
      s.style.left=Math.max(-h,Math.min(W-h,g.l+(e.clientX-g.x)/g.k))+'px';
      s.style.top=Math.max(-h,Math.min(H-h,g.t+(e.clientY-g.y)/g.k))+'px';
    });
    const end=()=>{
      if(!g)return;g=null;cancelAnimationFrame(raf);
      const n=$('mapbox').querySelector('.node[data-n="'+GOAL+'"]');let ok=false;
      if(n){const a=n.getBoundingClientRect(),b=s.getBoundingClientRect();
        ok=Math.hypot(a.left+a.width/2-(b.left+b.width/2),a.top+a.height/2-(b.top+b.height/2))<=a.width/2+b.width*.25}
      s.classList.remove('dragging');
      s.style.left=s.style.top=s.style.right='';   // 太陽回到原位
      if(ok){armed=false;s.classList.remove('armed');testUnlocked=true;updateGoldUI()}
    };
    s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end);
  }
})();

    const cx=grp.reduce((a,g)=>a+g.x,0)/grp.length,cy=grp.reduce((a,g)=>a+g.y,0)/grp.length,tg=aiPickTarget(c,{x:cx,y:cy});if(!tg)return;
    if(smart()&&keeps.includes(tg)&&tg.owner){const dn=turrets.filter(o=>o.c===tg.owner&&o.kind==='turret'&&o.hp>0&&Math.hypot(o.x-tg.x,o.y-tg.y)<T*17).length;   // 困難：目標砲塔太密、兵力不足時不硬衝，先等投石車清砲塔（最多等 2 分鐘）
      if(dn>=4&&grp.length<dn*2&&grp.every(g=>now-(g.waitSince||now)<120000)){if(unlocked('cata'))c.wantCata=now+20000;return}}
    const old=new Map(grp.map(g=>[g,g.goTo]));grp.forEach(g=>{g.goTo=null});let n=0;
    grp.forEach(g=>{const cell=soldierStandCell(Math.floor(tg.x/T),Math.floor(tg.y/T),g);if(cell){soldierOrder(g,cell,tg);g.wave=true;n++}else g.goTo=old.get(g)});
    grp.forEach(g=>{g.waitSince=0});if(n)floaters.push({x:cx,y:cy-T*2,text:'⚔'+c.d.n+'軍出擊！',born:now})};
  idle.forEach(g=>{if(!g.waitSince)g.waitSince=now});
  const oldest=fresh.reduce((m,g)=>Math.min(m,g.waitSince||now),now),ready=fresh.length+far.length>=need||(fresh.length+far.length>=3&&now-oldest>60000);   // 湊滿一波，或等超過 60 秒且至少 3 名
  if(ready&&fresh.length>0)launch(fresh.concat(far));
  else if(far.length>=Math.max(3,Math.round(need*.5)))launch(far);                       // 前線殘部夠多：繼續推進
  else if(far.length){far.forEach(g=>{const st=rally&&soldierStandCell(rally.x,rally.y,g);if(st){soldierOrder(g,st,null);g.wave=false;g.squad=true}})}   // 太少：撤回集結點
  aiRaid(c,mine,idle,now);
  if(c.threat>0)return;   // 家裡有威脅時，砲塔／投石車先不動

  if(now>=(c.siegeAt||0)){c.siegeAt=now+5000;
    const cats=turrets.filter(t=>t.c===c&&t.kind==='cata'&&t.hp>0);

      if(!(c.siegeTg&&objAlive(c.siegeTg)&&objOwner(c.siegeTg)!==c))c.siegeTg=aiSiegeTarget(c,{x:cx,y:cy});
      const tg=c.siegeTg;
      if(tg)cats.forEach(t=>{if(t.tgt&&objAlive(t.tgt))return;
        t.tgt=tg;t.plan=null;   // 指定對象後由 cataGuide 每幀處理：原地打得到就開火，否則走到最佳／最近位置
        })}
  }
  // 3) 沒有威脅時，把靠近主堡的多餘砲塔逐座向前線推進（擴大領地、增加火力覆蓋）
  if(now>=(c.pushAt||0)){c.pushAt=now+12000;
    const tt=turrets.filter(t=>t.c===c&&t.kind!=='cata'&&t.kind!=='trans'&&t.hp>0);
    if(tt.length>=7){
      const own=keepsOf(c),home=tt.filter(t=>own.some(k=>Math.hypot(k.x-t.x,k.y-t.y)<T*10));
      if(home.length>=5){
        const t=home.find(q=>!q.moving);
        if(t){let bf=foes[0],bd=1e18;foes.forEach(f=>{const d=Math.hypot(f.x-t.x,f.y-t.y);if(d<bd){bd=d;bf=f}});
          const sp=frontSpot(t,bf,'turret');
          if(sp&&Math.hypot((sp.gx+.5)*T-bf.x,(sp.gy+.5)*T-bf.y)<bd-T*5)commandMove(t,sp.gx,sp.gy,now)}}}
  }
}
function aiThink(c,now){
  const P=c.pers,[lo,hi]=P.think;
  c.nextThink=now+(lo+Math.random()*(hi-lo))*1000*Math.max(.5,1-(stage-1)*.012)*(smart()?.7:1);   // 關卡越高反應越快
  if(c.dead||gameOver)return;
  for(let n=0;n<3;n++){   // 一次思考最多連買 3 樣
    c.prodNext=c.prodNext||{turret:0,cata:0,general:0};const rdy=a=>!(PROD_CD[a.type]&&now<c.prodNext[a.type]);
    let acts=aiOptions(c,now);let pick=null;const op=c.opener.length?c.opener[0]:null;
    if(op){
      pick=acts.find(a=>a.type===op);
      if(!pick){c.opener.shift();continue}   // 開局項目買不了（沒空地、沒敵人…）就略過
      if(c.coins<pick.cost||!rdy(pick))break;           // 開局流程：存錢等到買得起、冷卻好
    }else{
      acts=acts.filter(rdy);acts.sort((a,b)=>b.score-a.score);const top=acts[0];if(!top||top.score<.12)break;
      pick=c.coins>=top.cost?top:(acts.find(a=>c.coins>=a.cost&&a.score>=top.score*P.patience)||null);   // 買不起最高分：耐心高就繼續存，否則先買差不多好的
    }
    if(!pick||!aiBuy(c,pick.type,now))break;
    if(op&&op===pick.type)c.opener.shift();
  }
}

function processProd(now){
  const p=castles&&castles[0];if(!p||p.dead||gameOver||playerDead)return;
  for(const t of ['turret','cata','trans','general']){
    const q=prodQ[t];if(!q.length||now<prodNext[t])continue;
    const o=q.shift();prodNext[t]=now+PROD_CD[t];
    const cost=WEAPON_COST[t],sw=selectedWeapon,st=selectedTurret,ws=weaponStatus;let ok=false;
    if(t==='general')ok=produceSoldier(now,o.home,o.rk,o.keep,o.auto,o.land);
    else if(o.free){ok=o.land?spawnAtLand(t,now,o.land):spawnAtTarget(t,now);if(!ok)gameCoins+=cost}   // 指定目標：自動前往可攻擊它的位置；打不到也照常生產，走到離目標最近處；只有無空位／已達上限才退款
    else{gameCoins+=cost;ok=_deployWeaponAt(t,o.x,o.y,now);if(ok&&o.ak){const nt=turrets[turrets.length-1];if(nt&&nt.c===p&&!nt.ak&&nt.kind===(t==='cata'?'cata':t==='trans'?'trans':'turret'))nt.ak=o.ak}}   // 先把已付的軍餉放回去，讓原本的部署流程照常扣款；失敗時就等於退款
    selectedWeapon=sw;selectedTurret=st;weaponStatus=ws;
    if(!ok){if(t==='general')gameCoins+=cost;floaters.push({x:p.x,y:p.y-T*2,text:'✖',born:now});sfx.bad()}
  }
}
function enemyObjAt(cx,cy,gx,gy,player){   // 點擊位置上的敵對物件：士兵 > 砲塔／投石車 > 銀樓 > 主堡

function autoSpot(k,type,mode,focus){   // 在此主堡周邊、己方領地內挑落點：home＝貼近主堡；front＝靠近最近的敵方主堡

/* ---------- 地震 ----------

function godQuake(){
  const now=gnow();if(!godMode||gameOver||now<god.busy.quake||!godPay())return;audio();
  god.busy.quake=now+CFG.GOD_QUAKE_MS;god.shake={start:now,end:now+CFG.GOD_QUAKE_MS,seed:Math.random()*100};
  godSfx.quake();godBtns(now);
  const f=godPlanFault();
  if(f){god.cracks.push({pts:f.pts,born:now+250,grow:1800,life:CFG.GOD_TRACE_MS});if(god.cracks.length>6)god.cracks.shift()}
  godSchedule(now+250,godQuakeDamage);
}
function godQuakeDamage(now){
  keeps.slice().forEach(k=>{if(k.dead||!k.owner)return;const d=Math.min(CFG.GOD_QUAKE_DMG,k.hp-1);if(d>0)hitCastle(k,d,GOD_BY,now,true)});   // 地震不會把主堡震到 0：最多扣到剩 1 點血
  treasuries.slice().forEach(b=>{if(gameOver)return;b.hp-=CFG.GOD_QUAKE_DMG;b.flash=now+300;if(b.hp<=0)godKillBank(b,now);else sfx.hit()})}
function godKillBank(b,now){bDown(b,0);treasuries=treasuries.filter(k=>k!==b);splash(b.x,b.y,10,'#7a5a12',80);floaters.push({x:b.x,y:b.y,text:'💥銀樓崩塌',born:now});sfx.turretKill()}
function godPlanFault(){   // 只決定裂縫的位置（純視覺痕跡），不改動任何地形
  const half=Math.max(22,Math.min(60,Math.round(Math.hypot(NX,NY)*.28)));
  const mx=(camX+VW/Z/2)/T+(Math.random()-.5)*VW/Z/T*.5,my=(camY+VH/Z/2)/T+(Math.random()-.5)*VH/Z/T*.5,ang=Math.random()*Math.PI,dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx;
  const p1=Math.random()*6.28,p2=Math.random()*6.28,A1=gr(.8,1.6),A2=gr(.3,.8),lat=u=>A1*Math.sin(u*.17+p1)+A2*Math.sin(u*.46+p2),pts=[];
  for(let u=-half;u<=half;u+=2)pts.push([(mx+dx*u+nx*lat(u))*T,(my+dy*u+ny*lat(u))*T]);
  return{pts}}

/* ---------- 隕石：隨機落在畫面各處，範圍 5×5 格，200 點傷害 ---------- */
function godMeteor(){
  const now=gnow();if(!godMode||gameOver||now<god.busy.meteor||!godPay())return;audio();
  let t=now;for(let i=0;i<CFG.GOD_METEOR_COUNT;i++){t+=i?gr(280,620):0;godSchedule(t,godMeteorSpawn)}
  god.busy.meteor=t+950;godBtns(now)}
function godMeteorSpawn(now){
  const sp=godPickSpot();if(!sp)return;const dur=950,side=Math.random()<.5?1:-1,X=(sp.cx+.5)*T,Y=(sp.cy+.5)*T;
  god.fx.push({k:'meteor',t0:now,dur,x:X,y:Y,sx:X+side*gr(240,380),sy:Y-gr(520,680)});
  godSfx.whistle();godSchedule(now+dur,n2=>godMeteorHit(sp.cx,sp.cy,n2))}
function godMeteorHit(cx,cy,now){
  const x0=(cx-2)*T,y0=(cy-2)*T,x1=(cx+3)*T,y1=(cy+3)*T,X=(cx+.5)*T,Y=(cy+.5)*T,dmg=CFG.GOD_METEOR_DMG,inside=o=>o.x>=x0&&o.x<=x1&&o.y>=y0&&o.y<=y1;
  god.fx.push({k:'blast',t0:now,dur:900,x:X,y:Y});
  god.decals.push({k:'crater',x:X,y:Y,born:now,life:CFG.GOD_TRACE_MS,seed:Math.random()*6});if(god.decals.length>80)god.decals.shift();

  godDust(X,Y,14,{sp:T*3,k:1.6,col:'70,60,50',a:1.2});godDust(X,Y,8,{sp:T*2,k:1.2,col:'200,150,90',l:.6});
  godSfx.impact();godKick(5,700);
  generals.slice().forEach(g=>{if(inside(g))hitGeneral(g,now,dmg,0)});   // 士兵（運輸車內的士兵不在場上，不受影響，車被毀才會現身）
  turrets.slice().forEach(t=>{if(!inside(t))return;t.hp-=dmg;t.flash=now+150;
    if(t.hp<=0){tDown(t,0);turrets=turrets.filter(k=>k!==t);splash(t.x,t.y,12,'#1a120c',90);floaters.push({x:t.x,y:t.y,text:'💥'+uName(t)+'被隕石擊毀',born:now});sfx.turretKill()}});
  treasuries.slice().forEach(b=>{if(!inside(b))return;b.hp-=dmg;b.flash=now+150;if(b.hp<=0)godKillBank(b,now)});
  keeps.slice().forEach(k=>{if(!k.dead&&k.owner&&k.gx-2<=cx+2&&k.gx+2>=cx-2&&k.gy-2<=cy+2&&k.gy+2>=cy-2)hitCastle(k,dmg,GOD_BY,now,true)})}

/* ---------- 閃電：隨機劈在畫面各處，範圍 1×1 格；只電死士兵（運輸車內的士兵躲得過），其他單位與建築不受影響 ---------- */
function godBolt(){
  const now=gnow();if(!godMode||gameOver||now<god.busy.bolt||!godPay())return;audio();
  let t=now;for(let i=0;i<CFG.GOD_BOLT_COUNT;i++){t+=i?gr(110,320):0;godSchedule(t,godBoltStrike)}
  god.busy.bolt=t+300;godBtns(now)}
function godBoltStrike(now){
  const sp=godPickSpot(true);if(!sp)return;const X=(sp.cx+.5)*T,Y=(sp.cy+.5)*T,topY=Math.min(Y-460,camY-80),x0=X+gr(-60,60),N=14,main=[];
  for(let i=0;i<=N;i++){const u=i/N;main.push([x0+(X-x0)*u+(i>0&&i<N?gr(-1,1)*20*(1-u*.4):0),topY+(Y-topY)*u])}
  const br=[];for(let b=0;b<2;b++){const k=3+(Math.random()*(N-6)|0);let [x,y]=main[k];const dir=Math.random()<.5?-1:1,pts=[[x,y]];for(let j=0;j<4;j++){x+=dir*gr(8,22);y+=gr(14,30);pts.push([x,y])}br.push(pts)}
  god.fx.push({k:'bolt',t0:now,dur:280,main,br});god.fx.push({k:'zap',t0:now,dur:520,x:X,y:Y,seed:(Math.random()*1000)|0});
  god.decals.push({k:'scorch',x:X,y:Y,born:now,life:9000});if(god.decals.length>80)god.decals.shift();
  god.flash={t:now,a:.18+Math.random()*.1};godSfx.bolt();
  generals.slice().forEach(g=>{if(g.hp>0&&Math.floor(g.x/T)===sp.cx&&Math.floor(g.y/T)===sp.cy){   // 1×1 格內的士兵：直接電死
    god.fx.push({k:'zap',t0:now,dur:700,x:g.x,y:g.y,seed:(Math.random()*1000)|0});godSfx.zap();hitGeneral(g,now,1e9,0)}})}

/* ---------- 繪製 ---------- */
function drawGame(now){
  if(!godMode){drawGame0(now);skyDraw(gctx,now);return}
  const cx=camX,cy=camY,[ox,oy]=godShakeOff(now);camX+=ox;camY+=oy;   // 晃動：暫時偏移鏡頭，畫完立刻還原（不影響邏輯座標）
  try{drawGame0(now);skyDraw(gctx,now);godSky(gctx,now)}finally{camX=cx;camY=cy}}
function godGround(c,now){   // 地面層：裂縫、彈坑、焦痕（畫在單位與建築底下）
  c.save();
  god.cracks=god.cracks.filter(k=>now<k.born+k.life);
  god.cracks.forEach(k=>{const p=Math.max(0,Math.min(1,(now-k.born)/k.grow));if(p<=0)return;c.globalAlpha=Math.max(0,1-(now-k.born)/k.life);const n=Math.floor((k.pts.length-1)*p);c.lineCap='round';c.lineJoin='round';
    [['rgba(20,10,4,.28)',7,0],['rgba(25,14,6,.88)',2.6,0],['rgba(214,196,150,.55)',.9,1.4]].forEach(([col,w,jx])=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();let pen=false;
      for(let i=0;i<=n;i++){const q=k.pts[i];if(!isLand(Math.floor(q[0]/T),Math.floor(q[1]/T))){pen=false;continue}if(!pen){c.moveTo(q[0]+jx,q[1]);pen=true}else c.lineTo(q[0]+jx,q[1])}c.stroke()})});
  god.decals=god.decals.filter(d=>now<d.born+d.life);
  god.decals.forEach(d=>{const age=now-d.born,fade=Math.max(0,Math.min(1,1-age/d.life));
    if(d.k==='crater'){const R=T*2.6;c.globalAlpha=fade*Math.min(1,age/150+.4);const g=c.createRadialGradient(d.x,d.y,2,d.x,d.y,R);g.addColorStop(0,'rgba(18,10,5,.82)');g.addColorStop(.45,'rgba(45,28,14,.55)');g.addColorStop(1,'rgba(70,50,28,0)');
      c.fillStyle=g;c.beginPath();c.arc(d.x,d.y,R,0,7);c.fill();c.strokeStyle='rgba(30,18,8,.5)';c.lineWidth=1.5;c.beginPath();c.ellipse(d.x,d.y,T*1.15,T*.95,d.seed,0,7);c.stroke()}
    else{c.globalAlpha=fade*.7;const g=c.createRadialGradient(d.x,d.y,1,d.x,d.y,T*.8);g.addColorStop(0,'rgba(25,20,18,.7)');g.addColorStop(1,'rgba(25,20,18,0)');c.fillStyle=g;c.beginPath();c.arc(d.x,d.y,T*.8,0,7);c.fill()}});
  c.restore()}
function godSky(c,now){   // 空中層：煙塵、墜落的隕石、爆炸、閃電、電擊、閃光
  c.setTransform(RS*Z,0,0,RS*Z,-camX*Z*RS,-camY*Z*RS);c.globalAlpha=1;
  god.dust.forEach(p=>{const t=(now-p.born)/p.life;if(t<0||t>1)return;const sec=(now-p.born)/1000,r=p.r0+(p.r1-p.r0)*Math.sqrt(t),a=p.a*(t<.12?t/.12:1)*(1-t);
    c.fillStyle='rgba('+p.col+','+a.toFixed(3)+')';c.beginPath();c.arc(p.x+p.vx*sec,p.y+p.vy*sec,r,0,7);c.fill()});
  god.fx.forEach(f=>{
    if(f.k==='meteor'){
      const u=Math.max(0,Math.min(1,(now-f.t0)/f.dur)),e=u*u*.55+u*.45,px=f.sx+(f.x-f.sx)*e,py=f.sy+(f.y-f.sy)*e;
      c.save();c.globalAlpha=.35+.25*Math.sin(now/70);c.strokeStyle='#d8341c';c.lineWidth=1.6;c.setLineDash([6,4]);c.strokeRect(f.x-2.5*T,f.y-2.5*T,5*T,5*T);c.setLineDash([]);   // 預告落點 5×5
      c.globalAlpha=.15+.3*u;c.fillStyle='#000';c.beginPath();c.ellipse(f.x,f.y,T*(.4+1.6*u),T*(.25+.9*u),0,0,7);c.fill();c.restore();
      const ang=Math.atan2(f.y-f.sy,f.x-f.sx),tl=150,gx=c.createLinearGradient(px,py,px-Math.cos(ang)*tl,py-Math.sin(ang)*tl);
      gx.addColorStop(0,'rgba(255,200,80,.9)');gx.addColorStop(.4,'rgba(255,110,30,.55)');gx.addColorStop(1,'rgba(120,40,10,0)');
      c.strokeStyle=gx;c.lineWidth=14;c.lineCap='round';c.beginPath();c.moveTo(px,py);c.lineTo(px-Math.cos(ang)*tl,py-Math.sin(ang)*tl);c.stroke();
      const hg=c.createRadialGradient(px,py,2,px,py,20);hg.addColorStop(0,'#fffbe0');hg.addColorStop(.35,'#ffb347');hg.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=hg;c.beginPath();c.arc(px,py,20,0,7);c.fill();
      c.fillStyle='#3b2a1c';c.beginPath();c.arc(px,py,7,0,7);c.fill()}
    else if(f.k==='blast'){
      const t=(now-f.t0)/f.dur;if(t<0||t>1)return;const R=T*2.9*(.2+.8*(1-Math.pow(1-t,3))),a=1-Math.pow(t,1.6),g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,R);
      g.addColorStop(0,'rgba(255,252,210,'+a+')');g.addColorStop(.35,'rgba(255,170,50,'+(.9*a)+')');g.addColorStop(.7,'rgba(190,60,20,'+(.55*a)+')');g.addColorStop(1,'rgba(60,20,10,0)');
      c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,R,0,7);c.fill();
      c.strokeStyle='rgba(255,230,180,'+(1-t)+')';c.lineWidth=1+4*(1-t);c.beginPath();c.arc(f.x,f.y,R*1.35,0,7);c.stroke();   // 衝擊波
      if(t<.25){c.globalAlpha=(1-t*4)*.7;c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(f.x-2.5*T,f.y-2.5*T,5*T,5*T);c.globalAlpha=1}}
    else if(f.k==='bolt'){
      const t=(now-f.t0)/f.dur;if(t<0||t>1)return;const a=(1-t)*(Math.floor(now/45)%2?1:.65);c.lineJoin='round';c.lineCap='round';
      [f.main].concat(f.br).forEach((pts,i)=>{const k=i?.55:1,dr=w=>{c.beginPath();pts.forEach((p,j)=>j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.lineWidth=w;c.stroke()};
        c.strokeStyle='rgba(110,160,255,'+(.22*a)+')';dr(11*k);c.strokeStyle='rgba(190,220,255,'+(.65*a)+')';dr(4.6*k);c.strokeStyle='rgba(255,255,255,'+a+')';dr(1.8*k)})}
    else if(f.k==='zap'){
      const t=(now-f.t0)/f.dur;if(t<0||t>1)return;const a=1-t,R=T*(.5+1.1*t),g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,T*2);
      g.addColorStop(0,'rgba(220,235,255,'+(.8*a)+')');g.addColorStop(.4,'rgba(120,170,255,'+(.35*a)+')');g.addColorStop(1,'rgba(80,120,255,0)');c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,T*2,0,7);c.fill();
      c.strokeStyle='rgba(200,225,255,'+a+')';c.lineWidth=1.6;c.strokeRect(f.x-T/2,f.y-T/2,T,T);c.beginPath();c.arc(f.x,f.y,R,0,7);c.stroke();   // 1×1 範圍＋擴散環
      const sd=Math.floor(now/55)+f.seed,rr=n=>{const v=Math.sin(sd*12.9898+n*78.233)*43758.5453;return v-Math.floor(v)};
      c.strokeStyle='rgba(235,245,255,'+a+')';c.lineWidth=1.3;
      for(let i=0;i<7;i++){let ang=i/7*6.28+rr(i)*.8,x=f.x,y=f.y;c.beginPath();c.moveTo(x,y);for(let s=0;s<4;s++){ang+=(rr(i*9+s)-.5)*1.6;const l=T*(.25+.2*rr(i*5+s+3));x+=Math.cos(ang)*l;y+=Math.sin(ang)*l;c.lineTo(x,y)}c.stroke()}}   // 電弧
  });
  const fa=god.flash.a*(1-(now-god.flash.t)/160);
  if(fa>0){c.setTransform(1,0,0,1,0,0);c.fillStyle='rgba(235,243,255,'+fa.toFixed(3)+')';c.fillRect(0,0,$('gc').width,$('gc').height)}
  c.globalAlpha=1}

/* ---------- 困難 AI 強化：受擊來源統計、主動搶佔損毀主堡 ---------- */
CFG.AI_ATK_MIN=30;   // 近期受到的傷害累計超過這個數值，AI 才開始依「被哪種單位打」調整出兵
function noteHit(c,type,dmg,now){   // 記錄 AI 勢力被哪種單位打（士兵／砲塔／投石車），傷害量隨時間衰減（時間常數 30 秒）
  if(!c||!(type==='soldier'||type==='turret'||type==='cata'))return;
  const h=c.atkBy||(c.atkBy={soldier:0,turret:0,cata:0,t:now}),k=Math.exp(-Math.max(0,now-h.t)/30000);
  h.soldier*=k;h.turret*=k;h.cata*=k;h.t=now;h[type]+=Math.max(0,dmg)}
function aiAtkMix(c,now){const h=c.atkBy;if(!h)return null;const k=Math.exp(-Math.max(0,now-h.t)/30000),s=h.soldier*k,t=h.turret*k,a=h.cata*k,tot=s+t+a;
  return tot<CFG.AI_ATK_MIN?null:{soldier:s/tot,turret:t/tot,cata:a/tot,tot}}
function aiClaimRuins(c,now,sel,own0){   // 困難：主動派閒置士兵搶佔損毀主堡（每座需 KEEP_CAPTURE 名駐守），不再只靠新兵順路去
  const own=own0||keepsOf(c);if(!own.length)return;
  const ruins=keeps.filter(r=>r.dead).map(r=>({r,d:Math.min(...own.map(k=>Math.hypot(k.x-r.x,k.y-r.y)))})).filter(o=>o.d<T*90).sort((a,b)=>a.d-b.d);
  if(!ruins.length)return;
  const free=g=>g.c===c&&g.hp>0&&!g.keepTg&&!g.home&&!g.fight&&!g.ordTg&&!g.wave&&(!sel||sel(g));
  ruins.forEach(({r,d})=>{
    const have=generals.filter(o=>o.c===c&&o.keepTg===r).length+r.gar.filter(o=>o.c===c).length,foe=r.gar.filter(o=>o.c!==c).length,need=KEEP_CAPTURE+Math.min(2,foe)-have;   // 城內有敵兵就多派幾名
    if(need<=0||(c.threat>0&&d>T*25))return;
    const pool=generals.filter(free).sort((a,b)=>Math.hypot(a.x-r.x,a.y-r.y)-Math.hypot(b.x-r.x,b.y-r.y)).slice(0,16);let n=0;
    for(const g of pool){if(n>=need)break;
      if(!soldierPath(Math.floor(g.x/T),Math.floor(g.y/T),Math.floor(r.x/T),Math.floor(r.y/T)))continue;
      g.keepTg=r;g.goTo=null;g.goDone=false;g.squad=false;g.path=null;g.pi=0;g.tg=null;g.pref=null;g.ptg=null;n++}
    if(n)floaters.push({x:r.x,y:r.y-T*2,text:'🚩'+c.d.n+'軍搶佔',born:now})})}

fit();resetGame();loop();backModes();
/* ---------- 懸停提示（data-tip，沒有就讀 title）---------- */
(function(){
  const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
  let cur=null,timer=0,lx=0,ly=0,shown=false,sup=false;
  const hide=()=>{clearTimeout(timer);timer=0;if(shown){tip.style.opacity=0;shown=false}};
  const find=t=>{const e=t&&t.closest?t.closest('[data-tip],[title]'):null;
    if(e&&e.hasAttribute('title')){if(e.title)e.dataset.tip=e.title;e.removeAttribute('title')}   // 取代瀏覽器內建 title（延遲約 1 秒且無法調整）
    return e&&e.dataset.tip?e:null};
  function show(){
    timer=0;if(!cur||!cur.isConnected||sup)return;
    tip.textContent=cur.dataset.tip;tip.style.left='0px';tip.style.top='0px';
    const r=cur.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    let x=r.left+r.width/2-tw/2;x=Math.max(6,Math.min(innerWidth-tw-6,x));
    let y=(r.top+r.height/2>innerHeight/2)?r.top-th-8:r.bottom+8;y=Math.max(6,Math.min(innerHeight-th-6,y));
    tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1;shown=true;
  }
  const arm=(x,y)=>{clearTimeout(timer);lx=x;ly=y;timer=setTimeout(show,500)};
  document.addEventListener('pointermove',e=>{
    if(e.pointerType&&e.pointerType!=='mouse')return;
    const el=find(e.target);
    if(el!==cur){hide();cur=el;sup=false;if(cur)arm(e.clientX,e.clientY);return}
    if(cur&&!shown&&!sup&&Math.hypot(e.clientX-lx,e.clientY-ly)>3)arm(e.clientX,e.clientY);   // 移動中不顯示，停住 0.5 秒才顯示
  },true);
  document.addEventListener('pointerdown',()=>{hide();sup=true},true);   // 點擊／拖曳時收起，離開再回來才會再顯示
  document.addEventListener('pointerout',e=>{if(!e.relatedTarget){hide();cur=null}},true);
  ['wheel','keydown','blur'].forEach(ev=>addEventListener(ev,()=>{hide()},true));
  // 武器卡片的說明（費用取自設定值）
  const W=(id,t)=>{const el=document.getElementById(id);if(el)el.dataset.tip=t};
  W('weapon-turret','砲塔（'+WEAPON_COST.turret+' 軍餉）：拖曳到己方空地部署；砲塔從主堡慢速走到該位置（目的地以虛框保留），射程 15 格（每座主堡 20 座，擁有幾座主堡就乘幾倍）');
  W('weapon-cata','投石車（'+WEAPON_COST.cata+' 軍餉）：規則同砲塔（佔地 1×1、拖曳部署、從主堡走到定點），移速 1/2、射程 16 格（砲塔 +1）、最小射程 10 格（10 格內的敵人打不到）、射速 1/10、威力 ×2、血量為砲塔 1/2；可邊走邊自動拋物線投石攻擊最近的敵方單位，不攻擊地面、不佔領土地（每座主堡 '+MAX_CATAS+' 座；能攻擊敵方主堡）');
  W('weapon-trans','運輸車（'+WEAPON_COST.trans+' 軍餉）：血量為砲塔 ×2、移速為士兵 ×3、無攻擊力，對所有兵種閃避 75%；每台載 '+CFG.TRANS_CAP+' 名士兵。拖曳到任何陸地部署（每座主堡 '+MAX_TRANS+' 台）；先選士兵再點運輸車＝上車（超過 6 名挑最近的 6 名）；選取後點敵方單位＝開到離它最近的可停位置；先點目的地（或敵方單位）再點卡片＝自動生產並開過去；停下後周圍 7 格內有敵對單位或建築，士兵會自動下車攻擊，打完回車上。');
  W('weapon-general','士兵（'+WEAPON_COST.general+' 軍餉）：點卡片後指定土地，從最近的主堡出發走到該處待命並追擊附近敵人（每座主堡上限 '+MAX_SOLDIERS+' 名）；已指定目標時點卡片即自動出發。點擊已損毀的主堡可指定士兵前往駐守，己方達 10 名且城內沒有敵軍即可佔領，這 10 名士兵會融入主堡而消失（扣除 10 名士兵份額）。先點選己方運輸車（可群選多台）再生產（或把士兵圖案拖曳到己方運輸車上）＝自動上車，每台最多 '+GAR_MAX+' 名；群選多台時自動分配，直到全部坐滿為止。先點敵方砲塔／投石車／主堡可指定優先攻擊目標，摧毀後改打最近目標。士兵克制投石車（對投石車攻擊閃躲 75%）、怕砲塔；射程 2 格，中地 +1、高地 +2');
  W('weapon-treasury','銀樓（'+WEAPON_COST.treasury+' 軍餉）：拖曳到己方土地，每座讓定時軍餉多一份基礎收入（最多 15 座）');
})();

<script>
function drawMenuArt(c,W,H){
  let seed=20260;const R=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
  const TAU=Math.PI*2, KAI="'DFKai-SB','BiauKai','Kaiti TC','KaiTi','STKaiti','標楷體',serif";   // 只有首頁旗幟用標楷體
  const lg=(x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
  const rg=(x,y,r0,r1,st)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};

  /* ---------- 天空：黃昏烽火 ---------- */
  c.fillStyle=lg(0,0,0,H*.72,[[0,'#1f1418'],[.28,'#5a2224'],[.55,'#b9502f'],[.8,'#e9a45e'],[1,'#f5d9a0']]);
  c.fillRect(0,0,W,H);
  // 日暈與紅日
  c.fillStyle=rg(640,330,10,520,[[0,'rgba(255,214,140,.75)'],[.35,'rgba(255,150,80,.32)'],[1,'rgba(255,120,60,0)']]);c.fillRect(0,0,W,H);
  c.fillStyle=rg(640,330,0,98,[[0,'#fff1c8'],[.7,'#f6b25c'],[1,'#e2703a']]);c.beginPath();c.arc(640,330,98,0,TAU);c.fill();
  // 水墨雲帶
  for(let i=0;i<16;i++){
    const y=40+R()*300,x=R()*W-100,w=260+R()*420,h=10+R()*18,a=.10+R()*.16;
    c.fillStyle=`rgba(${28+R()*20|0},${14+R()*10|0},${20+R()*10|0},${a})`;
    c.beginPath();c.moveTo(x,y);
    c.bezierCurveTo(x+w*.2,y-h*1.6,x+w*.6,y-h*1.2,x+w,y);
    c.bezierCurveTo(x+w*.7,y+h*1.4,x+w*.3,y+h*1.2,x,y);c.fill();
  }
  // 日前細雲
  c.fillStyle='rgba(60,26,28,.35)';
  [[520,318,320,9],[600,352,230,7],[470,372,380,6]].forEach(([x,y,w,h])=>{c.beginPath();c.ellipse(x+w/2,y,w/2,h,0,0,TAU);c.fill()});
  // 烏鴉
  c.strokeStyle='#1a1012';c.lineWidth=2;c.lineCap='round';
  [[470,250,1],[510,222,.8],[560,262,.9],[760,214,1.1],[800,250,.8],[720,188,.7]].forEach(([x,y,s])=>{c.beginPath();c.moveTo(x-9*s,y-4*s);c.quadraticCurveTo(x-4*s,y-8*s,x,y);c.quadraticCurveTo(x+4*s,y-8*s,x+9*s,y-4*s);c.stroke()});

  /* ---------- 山：層層水墨 ---------- */
  function ridge(base,amp,top,bot,sharp,f){
    const ph=[R()*6,R()*6,R()*6,R()*6];
    c.beginPath();c.moveTo(0,H);
    for(let x=0;x<=W;x+=3){const t=x/W;
      let n=Math.sin(t*f+ph[0])*.5+Math.sin(t*f*2.3+ph[1])*.3+Math.sin(t*f*4.7+ph[2])*.15+Math.sin(t*f*9.1+ph[3])*.07;
      n=sharp?1-Math.abs(n):n*.5+.5;
      c.lineTo(x,base-amp*n);}
    c.lineTo(W,H);c.closePath();c.fillStyle=lg(0,base-amp,0,base+60,[[0,top],[1,bot]]);c.fill();
  }
  const mist=(y,h,col)=>{c.fillStyle=lg(0,y-h,0,y+h,[[0,'rgba(255,214,160,0)'],[.5,col],[1,'rgba(255,214,160,0)']]);c.fillRect(0,y-h,W,h*2)};
  ridge(430,170,'#8d5a58','#d79868',true,5);   mist(440,50,'rgba(255,210,150,.42)');
  ridge(470,150,'#6b4047','#b97a58',true,7);   mist(478,44,'rgba(255,190,130,.38)');
  // 奇峰（國畫尖峰）
  function spire(x,base,w,h,col,col2){
    c.beginPath();c.moveTo(x-w/2,base);
    c.bezierCurveTo(x-w*.46,base-h*.4,x-w*.2,base-h*.7,x-w*.05,base-h);
    c.bezierCurveTo(x+w*.1,base-h*.78,x+w*.3,base-h*.45,x+w/2,base);c.closePath();
    c.fillStyle=lg(0,base-h,0,base,[[0,col],[1,col2]]);c.fill();
    c.strokeStyle='rgba(20,10,12,.35)';c.lineWidth=1.2;
    for(let i=0;i<7;i++){const yy=base-h*(.15+R()*.7);c.beginPath();c.moveTo(x-w*.18+R()*8,yy);c.quadraticCurveTo(x,yy-8,x+w*.2-R()*8,yy+R()*10);c.stroke()}
  }
  spire(110,520,150,330,'#4a2c36','#8a5254');spire(230,520,110,230,'#5a3540','#965a58');
  spire(1170,520,170,350,'#4a2c36','#8a5254');spire(1050,520,120,250,'#5a3540','#965a58');
  mist(500,40,'rgba(255,196,140,.35)');
  ridge(520,110,'#3d2430','#6a3c3c',false,6);

  /* ---------- 城池 ---------- */
  const INK='#1e1315',RED='#8e2a20';
  function roof(cx,y,w,h,col){
    c.fillStyle=col;c.beginPath();c.moveTo(cx-w/2-18,y+h);
    c.quadraticCurveTo(cx-w/2+8,y+h-3,cx-w*.27,y+h*.45);
    c.quadraticCurveTo(cx-w*.1,y+h*.12,cx,y);
    c.quadraticCurveTo(cx+w*.1,y+h*.12,cx+w*.27,y+h*.45);
    c.quadraticCurveTo(cx+w/2-8,y+h-3,cx+w/2+18,y+h);
    c.quadraticCurveTo(cx,y+h*.8,cx-w/2-18,y+h);c.fill();
    c.fillStyle='#d8a23a';c.fillRect(cx-2,y-9,4,10);c.beginPath();c.arc(cx,y-10,3,0,TAU);c.fill();
  }
  function glow(x,y,r,a=1){c.fillStyle=rg(x,y,0,r,[[0,`rgba(255,200,110,${.9*a})`],[.4,`rgba(255,120,50,${.45*a})`],[1,'rgba(255,90,30,0)']]);c.fillRect(x-r,y-r,r*2,r*2)}
  function tower(cx,base,w,tiers,th){
    let y=base,ww=w;
    for(let i=0;i<tiers;i++){
      const bh=th*.55;
      c.fillStyle=INK;c.fillRect(cx-ww/2+6,y-bh,ww-12,bh);
      c.fillStyle=RED;c.fillRect(cx-ww/2+10,y-bh,3,bh);c.fillRect(cx+ww/2-13,y-bh,3,bh);
      for(let k=0;k<3;k++){const wx=cx-ww/2+ww*(.22+k*.28);c.fillStyle='#ffb457';c.fillRect(wx,y-bh*.7,6,bh*.45);}
      roof(cx,y-bh-th*.45,ww,th*.5,'#2a1a1c');
      y-=bh+th*.32;ww*=.8;
    }
    return y;
  }
  // 城牆
  const wy=508;
  c.fillStyle=lg(0,wy-40,0,wy+20,[[0,'#3a2428'],[1,'#1e1315']]);c.fillRect(380,wy-30,520,50);
  c.fillStyle=INK;for(let x=380;x<900;x+=16)c.fillRect(x,wy-40,10,10);
  c.strokeStyle='rgba(255,170,90,.18)';c.lineWidth=1;for(let y=wy-20;y<wy+20;y+=10){c.beginPath();c.moveTo(380,y);c.lineTo(900,y);c.stroke()}
  // 城門洞
  c.fillStyle='#0e0809';c.beginPath();c.moveTo(612,wy+20);c.lineTo(612,wy-6);c.quadraticCurveTo(640,wy-26,668,wy-6);c.lineTo(668,wy+20);c.fill();
  glow(640,wy+6,26,.7);
  tower(640,wy-30,150,3,52);
  tower(430,wy-30,84,2,40);tower(850,wy-30,84,2,40);
  tower(545,wy-30,56,1,36);tower(735,wy-30,56,1,36);
  // 燃燒的城樓：火光與黑煙
  glow(430,wy-78,60,.8);glow(850,wy-90,70,.9);glow(640,wy-150,70,.55);
  function smoke(x,y,n,dx){for(let i=0;i<n;i++){const t=i/n;c.fillStyle=`rgba(24,14,16,${.32*(1-t)})`;c.beginPath();c.arc(x+dx*t*t*120+Math.sin(t*5+x)*8,y-t*190,10+t*34,0,TAU);c.fill()}}
  smoke(430,wy-90,18,.8);smoke(850,wy-100,20,-.9);smoke(235,540,14,.7);smoke(1040,545,14,-.7);
  // 旗杆城旗
  function flag(x,y,w,h,col,ch,dir=1,pole=true,tc='rgba(255,245,220,.95)'){
    if(pole){c.strokeStyle='#2a1a1c';c.lineWidth=3;c.beginPath();c.moveTo(x,y+h+40);c.lineTo(x,y-8);c.stroke();c.fillStyle='#d8a23a';c.beginPath();c.arc(x,y-10,3.5,0,TAU);c.fill()}
    c.save();c.translate(x,y);c.scale(dir,1);
    c.fillStyle=col;c.beginPath();c.moveTo(0,0);
    c.bezierCurveTo(w*.3,-h*.12,w*.6,h*.12,w,0);c.lineTo(w*.92,h*.5);c.lineTo(w,h);
    c.bezierCurveTo(w*.6,h*1.12,w*.3,h*.88,0,h);c.closePath();c.fill();
    c.strokeStyle='#d8a23a';c.lineWidth=2;c.stroke();
    c.fillStyle=tc;c.font=`bold ${h*.62|0}px ${KAI}`;c.textAlign='center';c.textBaseline='middle';
    c.save();c.translate(w*.5,h*.52);c.scale(dir,1);c.fillText(ch,0,0);c.restore();
    c.restore();
  }
  flag(640,wy-250,64,40,'#e6b422','漢',1,true,'#6e1a10');

  /* ---------- 前進地面 ---------- */
  c.fillStyle=lg(0,540,0,H,[[0,'#4a2a2a'],[.4,'#2c1a1c'],[1,'#120a0c']]);
  c.beginPath();c.moveTo(0,560);
  for(let x=0;x<=W;x+=8)c.lineTo(x,555+Math.sin(x*.012)*9+Math.sin(x*.05)*3);
  c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
  mist(556,26,'rgba(255,170,110,.35)');

  /* ---------- 兵與旗 ---------- */
  function soldier(x,y,s,col,dir,spearA=-.05){
    c.save();c.translate(x,y);c.scale(s*dir,s);
    c.fillStyle=INK;c.fillRect(-5,-11,4,11);c.fillRect(1,-11,4,11);
    c.fillStyle=col;c.beginPath();c.moveTo(-8,-10);c.lineTo(-6,-31);c.lineTo(6,-31);c.lineTo(8,-10);c.closePath();c.fill();
    c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-7,-20,14,3);
    c.fillStyle='#d9b48a';c.beginPath();c.arc(0,-36,4.6,0,TAU);c.fill();
    c.fillStyle=INK;c.beginPath();c.arc(0,-38,5.4,Math.PI,0);c.fill();c.fillRect(-1,-47,2,6);
    c.fillStyle=RED;c.fillRect(-1.5,-50,3,5);
    c.strokeStyle='#2a1a1c';c.lineWidth=1.8;c.beginPath();c.moveTo(11,0);c.lineTo(11+Math.sin(spearA)*80,-80);c.stroke();
    c.fillStyle='#d9d2c4';c.beginPath();c.moveTo(11+Math.sin(spearA)*80,-90);c.lineTo(8.5+Math.sin(spearA)*80,-78);c.lineTo(13.5+Math.sin(spearA)*80,-78);c.fill();
    c.fillStyle=col;c.beginPath();c.moveTo(11+Math.sin(spearA)*70,-72);c.lineTo(23,-66);c.lineTo(11+Math.sin(spearA)*66,-60);c.fill();
    c.restore();
  }
  function horse(x,y,s,col,dir){
    c.save();c.translate(x,y);c.scale(s*dir,s);
    c.fillStyle=INK;
    c.beginPath();c.ellipse(0,-34,30,13,-.05,0,TAU);c.fill();
    c.beginPath();c.moveTo(22,-40);c.quadraticCurveTo(38,-62,44,-60);c.lineTo(52,-50);c.quadraticCurveTo(44,-48,36,-36);c.closePath();c.fill();
    c.beginPath();c.moveTo(-28,-40);c.quadraticCurveTo(-48,-30,-44,-6);c.lineTo(-40,-6);c.quadraticCurveTo(-40,-26,-26,-32);c.fill();
    c.strokeStyle=INK;c.lineWidth=4;[[-20,-26,-24,0],[-12,-26,-10,0],[14,-26,18,0],[22,-26,30,-2]].forEach(l=>{c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke()});
    c.fillStyle=col;c.beginPath();c.moveTo(-8,-44);c.lineTo(-6,-70);c.lineTo(8,-70);c.lineTo(10,-44);c.fill();
    c.fillStyle='#d9b48a';c.beginPath();c.arc(1,-76,5,0,TAU);c.fill();c.fillStyle=INK;c.beginPath();c.arc(1,-78,5.8,Math.PI,0);c.fill();
    c.strokeStyle='#2a1a1c';c.lineWidth=2;c.beginPath();c.moveTo(14,-40);c.lineTo(46,-108);c.stroke();
    c.fillStyle='#d9d2c4';c.beginPath();c.moveTo(48,-116);c.lineTo(43,-104);c.lineTo(50,-104);c.fill();
    c.restore();
  }
  function army(x0,x1,rows,col,dir,chr,baseY){
    for(let r=0;r<rows;r++){
      const t=r/(rows-1||1), y=baseY+r*34, s=.5+t*.85, cnt=Math.round(9+t*3);
      for(let i=0;i<cnt;i++){
        const x=x0+(x1-x0)*(i+R()*.5)/cnt+r*dir*8;
        soldier(x,y+R()*5,s,col,dir,-.12+R()*.16);
      }
      if(r===1||r===rows-2){const bx=x0+(x1-x0)*(.3+R()*.4);flag(bx,y-130*s,70*s+10,44*s+6,col,chr,dir)}
    }
  }
  // 遠景綠軍（蜀）
  army(210,480,2,'#3f7d52',1,'蜀',566);
  army(800,1070,2,'#3f7d52',-1,'蜀',566);
  mist(612,26,'rgba(255,160,110,.28)');
  // 左：魏（藍）　右：吳（紅）
  army(30,470,3,'#2f6a96',1,'魏',606);
  army(810,1250,3,'#b5382b',-1,'吳',606);
  // 騎兵
  horse(300,690,1.15,'#2f6a96',1);horse(980,694,1.15,'#b5382b',-1);horse(120,705,1.3,'#2f6a96',1);horse(1160,708,1.3,'#b5382b',-1);

  // 投石車
  function catapult(x,y,s,dir){
    c.save();c.translate(x,y);c.scale(s*dir,s);
    c.strokeStyle='#241618';c.lineWidth=7;c.lineCap='round';
    c.beginPath();c.moveTo(-40,0);c.lineTo(-20,-34);c.lineTo(30,-34);c.lineTo(46,0);c.stroke();
    c.beginPath();c.moveTo(-8,-34);c.lineTo(-6,0);c.stroke();
    c.lineWidth=6;c.beginPath();c.moveTo(-6,-30);c.lineTo(52,-96);c.stroke();
    c.lineWidth=2;c.beginPath();c.moveTo(52,-96);c.quadraticCurveTo(62,-78,56,-66);c.stroke();
    c.fillStyle='#ff9a3c';c.beginPath();c.arc(56,-62,7,0,TAU);c.fill();
    c.fillStyle='#241618';[-34,38].forEach(wx=>{c.beginPath();c.arc(wx,2,11,0,TAU);c.fill();c.strokeStyle='#8a5a3a';c.lineWidth=1.5;c.beginPath();c.moveTo(wx-9,2);c.lineTo(wx+9,2);c.moveTo(wx,-7);c.lineTo(wx,11);c.stroke()});
    c.restore();glow(x+56*s*dir,y-62*s,26*s,.8);
  }
  catapult(330,640,1.05,1);catapult(950,642,1.05,-1);

  /* ---------- 火箭齊發與拋石 ---------- */
  function arrowArc(x0,y0,x1,y1,peak,t,fire){
    const x=x0+(x1-x0)*t,y0n=y0+(y1-y0)*t-Math.sin(t*Math.PI)*peak;
    const t2=t-.02,x2=x0+(x1-x0)*t2,y2=y0+(y1-y0)*t2-Math.sin(t2*Math.PI)*peak;
    c.strokeStyle=fire?'rgba(255,190,90,.95)':'rgba(30,16,18,.75)';c.lineWidth=fire?1.8:1.4;
    c.beginPath();c.moveTo(x2,y2);c.lineTo(x,y0n);c.stroke();
    if(fire){glow(x,y0n,10,.9)}
  }
  for(let i=0;i<34;i++){const t=.12+R()*.78;arrowArc(150+R()*260,590,560+R()*120,500,200+R()*130,t,R()<.35)}
  for(let i=0;i<34;i++){const t=.12+R()*.78;arrowArc(1130-R()*260,590,720-R()*120,500,200+R()*130,t,R()<.35)}
  // 拋石（火球）
  [[330,640,560,470,300,.55],[950,642,720,470,300,.55]].forEach(([a,b,cx,cy,p,t])=>{
    for(let k=8;k>0;k--){const tt=t-k*.02;const x=a+(cx-a)*tt,y=b+(cy-b)*tt-Math.sin(tt*Math.PI)*p;c.fillStyle=`rgba(255,${120+k*8},60,${.5-k*.05})`;c.beginPath();c.arc(x,y,9-k*.6,0,TAU);c.fill()}
    const x=a+(cx-a)*t,y=b+(cy-b)*t-Math.sin(t*Math.PI)*p;glow(x,y,34,1);c.fillStyle='#fff0c0';c.beginPath();c.arc(x,y,6,0,TAU);c.fill();
  });
  // 火星
  for(let i=0;i<150;i++){const x=R()*W,y=120+R()*520,r=.6+R()*1.8;c.fillStyle=`rgba(255,${150+R()*80|0},70,${.25+R()*.6})`;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}

  /* ---------- 前景松樹（左右） ---------- */
  function pine(x,y,s,dir){
    c.save();c.translate(x,y);c.scale(s*dir,s);
    c.strokeStyle='#150b0d';c.lineCap='round';
    c.lineWidth=12;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-18,-80,26,-130,4,-210);c.stroke();
    c.lineWidth=6;c.beginPath();c.moveTo(8,-120);c.quadraticCurveTo(60,-130,96,-170);c.stroke();
    c.beginPath();c.moveTo(-2,-90);c.quadraticCurveTo(-44,-110,-70,-96);c.stroke();
    c.fillStyle='#150b0d';
    [[4,-214,70,16],[96,-174,58,13],[-70,-98,48,12],[40,-168,40,10],[-30,-170,40,10]].forEach(([px,py,w,h])=>{
      c.beginPath();c.ellipse(px,py,w,h,-.08,0,TAU);c.fill();
      for(let k=0;k<12;k++){c.beginPath();c.moveTo(px+(R()-.5)*w*1.6,py+(R()-.3)*h);c.lineTo(px+(R()-.5)*w*2,py+h+R()*12);c.lineTo(px+(R()-.5)*w*1.6+4,py+(R()-.3)*h);c.fill()}
    });
    c.restore();
  }
  

  /* ---------- 紙質、暈影、金邊 ---------- */
  for(let i=0;i<5200;i++){c.fillStyle=R()<.5?`rgba(255,235,190,${R()*.05})`:`rgba(20,8,8,${R()*.06})`;c.fillRect(R()*W,R()*H,1+R()*1.6,1+R()*1.6)}
  c.fillStyle=rg(W/2,H*.45,H*.35,W*.72,[[0,'rgba(0,0,0,0)'],[1,'rgba(10,4,6,.62)']]);c.fillRect(0,0,W,H);
  c.fillStyle=lg(0,H-300,0,H,[[0,'rgba(12,6,8,0)'],[.55,'rgba(12,6,8,.6)'],[1,'rgba(10,4,6,.94)']]);c.fillRect(0,H-300,W,300);
  c.strokeStyle='rgba(216,162,58,.75)';c.lineWidth=3;c.strokeRect(8,8,W-16,H-16);
  c.strokeStyle='rgba(216,162,58,.4)';c.lineWidth=1;c.strokeRect(15,15,W-30,H-30);
  c.fillStyle='#d8a23a';[[8,8],[W-8,8],[8,H-8],[W-8,H-8]].forEach(([x,y])=>{c.fillRect(x-7,y-7,14,14);c.fillStyle='#8e2a20';c.fillRect(x-3,y-3,6,6);c.fillStyle='#d8a23a'});
}


(function(){
  const mp=document.getElementById('modepick');if(!mp)return;
  const W=1280,H=720,S=1.5,cv=document.createElement('canvas');cv.id='menubg';cv.width=W*S;cv.height=H*S;
  mp.insertBefore(cv,mp.firstChild);
  try{const c=cv.getContext('2d');c.scale(S,S);drawMenuArt(c,W,H)}catch(e){console.error(e)}
})();

(function(){

  const CJK=/[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/;

  const PRE=/[（）：，、；。！？／・＝～｜＋「」]/g;
  const cache=new Map();
  /* 浮動說明專用整句規則：字典逐詞替換會產生重複或拗口的英文，這幾條改成通順的整句（先套用，剩下的中文再交給字典） */
  const TIPX=[
    [/^投石車（(\d+) 軍餉）：規則同砲塔（佔地 1×1、拖曳部署、從主堡走到定點），移速 1\/2、射程 16 格（砲塔 \+1）、最小射程 10 格（10 格內的敵人打不到）、射速 1\/10、威力 ×2、血量為砲塔 1\/2；可邊走邊自動拋物線投石攻擊最近的敵方單位，不攻擊地面、不佔領土地（每座主堡 (\d+) 座；能攻擊敵方主堡）/,
      (m,c,n)=>`Catapult (${c} coins): same rules as turrets (1×1 footprint, drag to deploy, walks from the keep to its spot), but at half the move speed. Range 16 tiles (turret +1), minimum range 10 tiles (enemies within 10 tiles can't be hit), 1/10 the fire rate, ×2 damage and half a turret's HP. Lobs arcing stones at the nearest enemy unit, even while moving; it doesn't hit the ground or capture land, but can attack enemy keeps. Limit ${n} per keep.`],
    [/^砲彈速度升級（僅本局有效）：每級速度 \+0\.5 倍，最高 4 級/,()=>'Shell speed upgrade (this match only): +0.5× speed per level, max level 4'],
    [/^(.+?)軍（AI・(.+?)）：領地 (\d+) 格｜軍餉 (\d+)｜銀樓 (\d+)｜砲塔 (\d+)｜投石車 (\d+)｜士兵 (\d+)｜攻擊 ×([\d.]+)・血量 ×([\d.]+)・速度 ×([\d.]+)。?/,
      (m,nm,pers,t,co,b,tu,ca,so,a,h,sp)=>`${tr(nm+'軍')} (AI · ${tr(pers)}): Territory ${t} tiles | Coins ${co} | Banks ${b} | Turrets ${tu} | Catapults ${ca} | Soldiers ${so} | ATK ×${a} · HP ×${h} · Speed ×${sp}. `],
    [/（每座主堡上限 (\d+) 名）/g,(m,n)=>`(limit ${n} per keep)`],
    [/（每座主堡 (\d+) 台）/g,(m,n)=>`(limit ${n} per keep)`]
  ];
  function tr(s){
    if(lang!=='en'||typeof s!=='string'||!s||!CJK.test(s))return s;
    let r=cache.get(s);if(r!==undefined)return r;
    if(s.trim().length===1){r=s}   // 單一漢字（陣營徽章）保留原樣
    else{
      let s0=s;for(const[re,fn]of TIPX)s0=s0.replace(re,fn);
      r=s0.replace(RE,m=>{const v=D[m];return v?(/^[A-Za-z0-9]/.test(v)?' ':'')+v+(/[A-Za-z0-9]$/.test(v)?' ':''):v}).replace(PRE,c=>PUN[c]).replace(/ {2,}/g,' ').replace(/ +([;,:.)!?])/g,'$1').replace(/\( +/g,'(');
      r=/^\s*/.exec(s)[0]+r.trim()+/\s*$/.exec(s)[0];
    }
    if(cache.size>5000)cache.clear();
    cache.set(s,r);return r;
  }
  window.__tr=tr;

  const ATTR=['data-tip','title','placeholder'];
  const TXT=new WeakMap();   // 文字節點 → {o:原文, t:譯文}
  const skipEl=el=>!el||el.nodeType!==1?false:(el.tagName==='SCRIPT'||el.tagName==='STYLE'||el.id==='tip'&&/Chinese ⇄ English/.test(el.textContent)||!!el.closest('[data-notr]'));
  function fixText(n){
    if(lang!=='en')return;
    const p=n.parentNode;if(!p||skipEl(p))return;
    const v=n.nodeValue,rec=TXT.get(n);
    if(rec&&v===rec.t)return;
    if(!CJK.test(v)){if(rec)TXT.delete(n);return}
    const t=tr(v);if(t!==v){TXT.set(n,{o:v,t});n.nodeValue=t}
  }
  function fixAttrs(el){
    if(lang!=='en'||skipEl(el))return;
    for(const a of ATTR){
      const v=el.getAttribute(a);if(!v)continue;
      const o=el.__o&&el.__o[a];
      if(o&&v===o.t)continue;
      if(!CJK.test(v))continue;
      const t=tr(v);if(t!==v){(el.__o||(el.__o={}))[a]={o:v,t};el.setAttribute(a,t)}
    }
  }
  function scan(root){
    if(root.nodeType===3){fixText(root);return}
    if(root.nodeType!==1||skipEl(root))return;
    fixAttrs(root);
    root.querySelectorAll('[data-tip],[title],[placeholder]').forEach(fixAttrs);
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    let n;while(n=w.nextNode())fixText(n);
  }
  function restore(root){   // 還原成中文原文
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    let n;while(n=w.nextNode()){const rec=TXT.get(n);if(rec){if(n.nodeValue===rec.t)n.nodeValue=rec.o;TXT.delete(n)}}
    root.querySelectorAll('*').forEach(el=>{
      if(!el.__o)return;
      for(const a in el.__o){const r=el.__o[a];if(el.getAttribute(a)===r.t)el.setAttribute(a,r.o)}
      el.__o=null;
    });
  }
  new MutationObserver(list=>{
    if(lang!=='en')return;
    for(const m of list){
      if(m.type==='characterData')fixText(m.target);
      else if(m.type==='attributes')fixAttrs(m.target);
      else m.addedNodes.forEach(scan);
    }
  }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});

  /* 升級卡片的提示由遊戲在原文後面加字：先固定中文原文，避免切換語言時疊字 */
  document.querySelectorAll('.battle-upgrade[data-tip]').forEach(el=>{if(!el.dataset.base)el.dataset.base=el.dataset.tip});

  /* --- 畫布文字、對話框 --- */
  const P=CanvasRenderingContext2D.prototype;
  ['fillText','strokeText','measureText'].forEach(k=>{
    const f=P[k];
    P[k]=function(t,...a){return f.call(this,typeof t==='string'?tr(t):t,...a)};
  });
  const _c=window.confirm,_a=window.alert;
  window.confirm=m=>_c.call(window,tr(String(m)));
  window.alert=m=>_a.call(window,tr(String(m)));

  /* --- 套用語言 --- */
  const zhTitle=document.title;
  const lb=document.getElementById('langbtn');
  function apply(){
    document.documentElement.lang=lang==='en'?'en':'zh-Hant';
    document.title=lang==='en'?tr(zhTitle):zhTitle;
    if(lb){lb.dataset.l=lang==='en'?'EN':'中';lb.dataset.tip=lang==='en'?'Language: click to switch Chinese ⇄ English':'語言 Language：點擊切換 中文 ⇄ English'}
    if(lang==='en')scan(document.body);else restore(document.body);
  }
  if(lb)lb.onclick=()=>{
    lang=lang==='en'?'zh':'en';
    try{localStorage.setItem(KEY,lang)}catch(e){}
    try{window.name='sg_lang='+lang}catch(e){}
    apply();
  };
  apply();
})();
</script>
</body>
</html>
